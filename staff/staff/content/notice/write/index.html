	<div class="user-menu">

		<div class="user-chip">
			<div class="avatar">박</div>

			<div class="meta">
				<div class="n">박지상</div>

		<form action="/skyroute/staff/member/logout" method="post" style="margin:0;"><input type="hidden" name="_csrf" value="-kbY6JHQ3tvruxu2WrmlFlXbWL8phoKgGhyfsvVUqOT5hZv8zHPu36ez6-vGiizTaZSRJm3jdd0Qv7eNKST-08E3zoCf4avL"/>
			<input type="hidden"
			       name="_csrf"

</header>

<main class="main">

	<h1>공지사항 등록</h1>
	<p class="desc">사용자 페이지에 노출할 공지사항을 등록합니다.</p>

	<div class="card">

		<form action="/skyroute/staff/staff/content/notice/write"
			  method="post"><input type="hidden" name="_csrf" value="-kbY6JHQ3tvruxu2WrmlFlXbWL8phoKgGhyfsvVUqOT5hZv8zHPu36ez6-vGiizTaZSRJm3jdd0Qv7eNKST-08E3zoCf4avL"/>

			<input type="hidden"
				   name="_csrf"
				   value="-kbY6JHQ3tvruxu2WrmlFlXbWL8phoKgGhyfsvVUqOT5hZv8zHPu36ez6-vGiizTaZSRJm3jdd0Qv7eNKST-08E3zoCf4avL">

			<div class="form-grid">

				<div class="field full">
					<label for="title">제목</label>
					<input type="text"
						   id="title"
						   class="input"
						   maxlength="200"
						   placeholder="공지사항 제목을 입력하세요" name="title" value="">
						   
					
				</div>
				
				<div class="field">
					<label for="category">카테고리</label>
					<select id="category" class="select" name="category">
						<option value="">카테고리 선택</option>
						<option value="SKY_NEWS">스카이 소식</option>
						<option value="FUEL_SURCHARGE">유류할증료</option>
						<option value="MEMBERSHIP_CLUB">멤버십클럽</option>
						<option value="PARTNER_NEWS">제휴사 소식</option>
						<option value="ETC">기타</option>
					</select>
				
					
				</div>

				<div class="field">
					<label for="is_public">공개 여부</label>
					<select id="is_public" class="select" name="is_public">
						<option value="Y" selected="selected">공개</option>
						<option value="N">비공개</option>
					</select>

					
				</div>

				<div class="field full">
					<label for="content">본문</label>
					<textarea id="content"
							  class="textarea notice-textarea"
							  placeholder="공지사항 본문을 입력하세요" name="content"></textarea>

					
				</div>

			</div>

			<div class="toolbar" style="margin-top:20px;">
				<div class="grow"></div>

				<a href="/skyroute/staff/staff/content/notice/list" class="btn btn-ghost">취소</a>

				<button type="submit" class="btn btn-primary">
					<span class="material-symbols-outlined" style="font-size:18px">save</span>
					등록
				</button>
			</div>

		</form>

	</div>

</main>

</body>
