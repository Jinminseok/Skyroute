<div>

	<div id="eventStatsFragment" class="grid grid-4" style="margin-bottom:24px">
		<div class="stat event-stat-card" data-event-status="">
			<div class="label">
				<span class="material-symbols-outlined" style="font-size:18px">local_activity</span>
				전체 이벤트
			</div>
			<div class="value">
				<span>6</span><span class="unit">건</span>
			</div>
		</div>

		<div class="stat event-stat-card" data-event-status="visible">
			<div class="label">
				<span class="material-symbols-outlined" style="font-size:18px; color:var(--ok)">visibility</span>
				메인 노출 중
			</div>
			<div class="value" style="color:var(--ok)">
				<span>4</span><span class="unit">건</span>
			</div>
		</div>

		<div class="stat event-stat-card" data-event-status="ongoing">
			<div class="label">
				<span class="material-symbols-outlined" style="font-size:18px; color:var(--primary)">play_circle</span>
				응모 진행 중
			</div>
			<div class="value" style="color:var(--primary)">
				<span>4</span><span class="unit">건</span>
			</div>
		</div>

		<div class="stat event-stat-card" data-event-status="draw">
			<div class="label">
				<span class="material-symbols-outlined" style="font-size:18px; color:var(--warn)">casino</span>
				추첨 필요
			</div>
			<div class="value" style="color:var(--warn)">
				<span>0</span><span class="unit">건</span>
			</div>
		</div>
	</div>

	<div id="eventListFragment">

		<div class="toolbar">
			<a href="/skyroute/staff/staff/content/event/write" class="btn btn-primary">
				<span class="material-symbols-outlined" style="font-size:18px">add</span>
				새 이벤트 등록
			</a>

			<div class="grow"></div>

			<span class="badge badge-scheduled">EVENT</span>
		</div>

		<form id="eventSearchForm" class="event-filter-bar">
			<div class="event-filter-left">
				<input type="hidden"
					   id="eventStatus"
					   name="status"
					   value="scheduled">

				<div class="event-filter-group">
					<button type="button"
							class="event-filter-btn"
							data-status="">
						전체
					</button>
					<button type="button"
							class="event-filter-btn"
							data-status="visible">
						메인 노출 중
					</button>

					<button type="button"
							class="event-filter-btn"
							data-status="ongoing">
						진행 중
					</button>

					<button type="button"
							class="event-filter-btn active"
							data-status="scheduled">
						진행 예정
					</button>

					<button type="button"
							class="event-filter-btn event-filter-draw"
							data-status="draw">
						추첨 필요
					</button>

					<button type="button"
							class="event-filter-btn"
							data-status="ended">
						종료됨
					</button>
				</div>

				<div class="event-search-box">
					<span class="material-symbols-outlined">search</span>

					<input type="search"
						   name="keyword"
						   value=""
						   placeholder="이벤트명을 검색하세요"
						   autocomplete="off">
				</div>

				<button type="submit" class="btn btn-primary btn-sm">
					검색
				</button>

				<button type="button"
						id="eventSearchReset"
						class="btn btn-ghost btn-sm">
					초기화
				</button>
			</div>

			<div class="event-result-count">
				검색 결과
				<strong>0</strong>건
			</div>
		</form>

		<div class="card">
			<div class="table-wrap">
				<table class="data event-data">
					<colgroup>
				        <col style="width:130px">
				        <col style="width:200px">
				        <col style="width:200px">
				        <col style="width:70px">
				        <col style="width:85px">	
				        <col style="width:90px">
				        <col style="width:140px">
				        <col style="width:80px">
				        <col style="width:160px">
				    </colgroup>
					<thead>
						<tr>
							<th>배너 이미지</th>
							<th>이벤트명</th>
							<th>진행 기간</th>
							<th>노출 순서</th>
							<th>노출 여부</th>
							<th>진행 여부</th>
							<th>이벤트 상태</th>
							<th>참여자 수</th>
							<th>콘텐츠 편집</th>
						</tr>
					</thead>

					<tbody>
						<tr>
							<td colspan="9">조건에 맞는 이벤트가 없습니다.</td>
						</tr>

						
					</tbody>
				</table>
			</div>

			
		</div>

	</div>

</div>
