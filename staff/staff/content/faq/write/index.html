</header>

    <main class="main">
        <div style="max-width: 900px; margin: 0 auto;">
            <h1>새 FAQ 등록</h1>
            <p class="desc">고객지원 페이지에 노출될 자주 묻는 질문(FAQ)을 작성합니다.</p>

            <div class="card notice-card">
                <form action="/skyroute/staff/staff/content/faq/write" method="post"><input type="hidden" name="_csrf" value="WlswjM-ixndsoqvRFsPyQHacJF-BBooBDNimuJiSCJOh292CbG4Gu_nB80dBk5y0Je7GcE6kCT24P78sP-DH2azxbvfHv-21"/>
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                        
                        <div class="field">
                            <label>카테고리 분류 *</label>
                            <select name="category" class="select" required>
                                <option value="">선택하세요</option>
                                <option value="예약/항공권">예약/항공권</option>
                                <option value="결제/환불">결제/환불</option>
                                <option value="수하물">수하물</option>
                                <option value="탑승/수속">탑승/수속</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>공개 여부 *</label>
                            <select name="is_visible" class="select" required>
                                <option value="Y">공개 (사용자 페이지에 즉시 노출)</option>
                                <option value="N">비공개 (관리자만 열람 가능)</option>
                            </select>
                        </div>

                        <div class="field full">
                            <label>질문 (Question) *</label>
                            <input type="text" name="question" class="input" placeholder="고객이 자주 묻는 질문을 명확하게 작성해주세요." required>
                        </div>

                        <div class="field full">
                            <label>답변 (Answer) *</label>
                            <textarea name="answer" class="textarea notice-textarea" placeholder="질문에 대한 상세한 답변을 작성해주세요." required></textarea>
                        </div>

                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                        <a href="/skyroute/staff/staff/content/faq/list" class="btn btn-ghost">취소 및 목록으로</a>
                        <button type="submit" class="btn btn-primary">FAQ 등록</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
