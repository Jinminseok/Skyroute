    <main class="main">
        <div style="max-width: 900px; margin: 0 auto;">
            <h1>FAQ 수정</h1>
            <p class="desc">등록된 FAQ의 내용을 수정합니다.</p>

            <div class="card notice-card">
                <form action="/skyroute/staff/staff/content/faq/modify" method="post"><input type="hidden" name="_csrf" value="E3U_-ZIW_TkPof7QYsGJe2McdK5Jf7dr4Xt2-zgje4S0kBBMJUAJzqR1yAkikMm1Uey9S1skWcxwRoJG0kMXmgxAHeDS9CB7"/>
                    <input type="hidden" name="faq_id" value="15">
                    
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                        
                        <div class="field">
                            <label>카테고리 분류 *</label>
                            <select name="category" class="select" required>
                                <option value="예약/항공권">예약/항공권</option>
                                <option value="결제/환불">결제/환불</option>
                                <option value="수하물">수하물</option>
                                <option value="탑승/수속">탑승/수속</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>공개 여부 *</label>
                            <select name="is_visible" class="select" required>
                                <option value="Y" selected="selected">공개 (사용자 페이지에 노출)</option>
                                <option value="N">비공개</option>
                            </select>
                        </div>

                        <div class="field full">
                            <label>질문 (Question) *</label>
                            <input type="text" name="question" class="input" value="어떤 결제 수단을 사용할 수 있나요?" required>
                        </div>

                        <div class="field full">
                            <label>답변 (Answer) *</label>
                            <textarea name="answer" class="textarea notice-textarea" required>신용카드와 카카오페이 결제를 지원합니다. 결제 수단별 한도 및 이용 조건은 각 카드사 또는 간편결제사의 정책을 따릅니다.</textarea>
                        </div>

                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                        <a href="/skyroute/staff/staff/content/faq/detail?faq_id=15" class="btn btn-ghost">취소</a>
                        <button type="submit" class="btn btn-primary">수정 완료</button>
                    </div>
                </form>
            </div>
