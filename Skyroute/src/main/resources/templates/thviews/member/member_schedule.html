<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout_basic}">
<head>
<meta charset="UTF-8">
<title>에어누리 - 출/도착 및 스케줄 조회</title>
<link rel="stylesheet" th:href="@{/assets/css/member.css}" type="text/css">	
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
<script type="text/javascript" th:src="@{/assets/js/yh.member.js}"></script>
<style>
    /* 상단 탭 스타일 */
    .schedule-tabs { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .schedule-tab { font-size: 15px; font-weight: 500; color: var(--mut); cursor: pointer; padding: 4px 8px; position: relative; }
    .schedule-tab.active { color: var(--accent); font-weight: 600; }
    .schedule-tab.active::after { content: ''; position: absolute; bottom: -11px; left: 0; width: 100%; height: 2px; background: var(--accent); }
</style>
</head>
<body>
    <div layout:fragment="panel">
        <div class="wrap" style="padding-top: 40px; padding-bottom: 60px;">
            <div class="htitle" style="margin-bottom: 24px;">
                <div>
                    <div class="eyebrow">FLIGHT SCHEDULE</div>
                    <h2 style="font-size: 22px; font-weight: 600; margin-top: 5px;">출/도착 및 스케줄 조회</h2>
                </div>
            </div>

            <div class="schedule-tabs">
                <div class="schedule-tab active" onclick="switchTab('route')">출/도착지 기준 조회</div>
                <div class="schedule-tab" onclick="switchTab('flight')">편명 기준 조회</div>
            </div>

            <div class="searchcard" id="searchRouteSection" style="margin-top:0; padding-bottom:24px; display: block;">
                <div class="fields" style="grid-template-columns:1fr 1fr 1fr">
                    <div class="field">
                        <label>출발지</label>
                        <input type="text" class="chat-side-input" style="width:100%; height: 32px; margin-top:4px;" placeholder="EX) ICN 또는 인천">
                    </div>
                    <div class="field">
                        <label>도착지</label>
                        <input type="text" class="chat-side-input" style="width:100%; height: 32px; margin-top:4px;" placeholder="EX) JFK 또는 뉴욕">
                    </div>
                    <div class="field" style="border-right:0">
                        <label>날짜</label>
                        <input type="date" class="chat-side-input" style="width:100%; height: 32px; margin-top:4px; font-family: var(--sans-eng);">
                    </div>
                </div>
                <div class="searchrow">
                    <div class="opts"><span style="font-size: 13px; color: var(--mut);">* 입력하신 출발/도착 노선의 전체 실시간 운항 리스트를 가져옵니다.</span></div>
                    <a th:href="@{/schedule/list}" class="btn" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none; height: 42px;">스케줄 조회</a>
                </div>
            </div>

            <div class="searchcard" id="searchFlightSection" style="margin-top:0; padding-bottom:24px; display: none;">
                <div class="fields" style="grid-template-columns: 1fr 1fr;">
                    <div class="field">
                        <label>항공 편명</label>
                        <input type="text" class="chat-side-input" style="width:100%; height: 32px; margin-top:4px; font-family: var(--mono);" placeholder="EX) NU101">
                    </div>
                    <div class="field" style="border-right:0">
                        <label>출발 날짜</label>
                        <input type="date" class="chat-side-input" style="width:100%; height: 32px; margin-top:4px; font-family: var(--sans-eng);">
                    </div>
                </div>
                <div class="searchrow">
                    <div class="opts"><span style="font-size: 13px; color: var(--mut);">* 정확한 편명을 입력하시면 해당 항공편의 타임라인을 조회합니다.</span></div>
                    <a th:href="@{/schedule/list}" class="btn" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none; height: 42px;">편명 조회</a>
                </div>
            </div>

            <div style="margin-top: 24px;" class="results">
                <h3 style="font-size: 15px; font-weight: 500; margin-bottom: 12px; color: var(--ink-500);">운항 스케줄 검색 결과</h3>
                
                <div class="trip" style="margin-bottom: 12px;">
                    <div>
                        <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px">
                            <span class="stat soon" style="background: var(--accent-soft); color: var(--accent); font-family: var(--mono);">NU101</span>
                            <span class="pnr" style="font-weight: 500; color: var(--mut);">B777-300ER</span>
                        </div>
                        <div class="rt" style="font-weight: 500; font-size: 17px;">ICN 인천 ➔ JFK 뉴욕</div>
                        <div class="dt" style="font-weight: 400; font-size: 13px; margin-top: 4px;">
                            <span style="color: var(--accent); font-weight: 600;">출발</span> 2026.12.20 10:30 &nbsp;|&nbsp; 
                            <span style="color: var(--bad); font-weight: 600;">도착</span> 2026.12.20 22:00 (현지시간)
                        </div>
                    </div>
                    <div class="actions">
                        <a th:href="@{/booking/flightList(departure='ICN', arrival='JFK', date='2026-12-20')}" class="btn sm" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none; padding: 0 16px;">예매하러 가기</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script th:inline="javascript">
        function switchTab(type) {
            const tabs = document.querySelectorAll('.schedule-tab');
            const routeSec = document.getElementById('searchRouteSection');
            const flightSec = document.getElementById('searchFlightSection');

            tabs.forEach(t => t.classList.remove('active'));
            
            if(type === 'route') {
                tabs[0].classList.add('active');
                routeSec.style.display = 'block';
                flightSec.style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                routeSec.style.display = 'none';
                flightSec.style.display = 'block';
            }
        }
    </script>
</body>
</html>
