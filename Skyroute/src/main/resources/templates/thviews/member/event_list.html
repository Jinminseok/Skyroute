<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/layout_basic}">
<head>
	<meta charset="UTF-8">
	<title>이벤트</title>
</head>
<body>

<th:block layout:fragment="panel">

	<style>
		.user-event-page {
			max-width: 1200px;
			margin: 0 auto;
			padding: 70px 24px 100px;
		}

		.user-event-title-area {
			margin-bottom: 42px;
			text-align: center;
		}

		.user-event-title-area h1 {
			margin: 0 0 14px;
			font-size: 38px;
			font-weight: 800;
			color: #111827;
		}

		.user-event-title-area p {
			margin: 0;
			font-size: 16px;
			color: #64748b;
		}

		.user-event-tabs {
			display: flex;
			justify-content: center;
			margin-bottom: 50px;
			border-bottom: 1px solid #dbe3ec;
		}

		.user-event-tabs a {
			min-width: 190px;
			padding: 19px 24px;
			border-bottom: 3px solid transparent;
			color: #64748b;
			font-size: 16px;
			font-weight: 600;
			text-align: center;
			text-decoration: none;
		}

		.user-event-tabs a:hover {
			color: #0066e2;
		}

		.user-event-tabs a.is-active {
			border-bottom-color: #0066e2;
			color: #0066e2;
			font-weight: 800;
		}

		.user-event-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 28px;
		}

		.user-event-card {
			overflow: hidden;
			border: 1px solid #e2e8f0;
			border-radius: 18px;
			background: #ffffff;
			box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}

		.user-event-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12);
		}

		.user-event-card a {
			display: block;
			color: inherit;
			text-decoration: none;
		}

		.user-event-image {
			position: relative;
			width: 100%;
			aspect-ratio: 16 / 10;
			overflow: hidden;
			background: #e2e8f0;
		}

		.user-event-image img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform 0.3s ease;
		}

		.user-event-card:hover .user-event-image img {
			transform: scale(1.04);
		}

		.user-event-badge {
			position: absolute;
			top: 16px;
			left: 16px;
			padding: 7px 12px;
			border-radius: 999px;
			background: #0066e2;
			color: #ffffff;
			font-size: 13px;
			font-weight: 700;
		}

		.user-event-info {
			padding: 24px;
		}

		.user-event-info h2 {
			margin: 0 0 14px;
			overflow: hidden;
			color: #172033;
			font-size: 20px;
			font-weight: 750;
			line-height: 1.45;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.user-event-period {
			display: flex;
			align-items: center;
			gap: 7px;
			margin: 0;
			color: #64748b;
			font-size: 14px;
		}

		.user-event-period .material-symbols-outlined {
			font-size: 19px;
		}

		.user-event-empty {
			padding: 90px 30px;
			border: 1px solid #e2e8f0;
			border-radius: 18px;
			background: #f8fafc;
			text-align: center;
		}

		.user-event-empty .material-symbols-outlined {
			margin-bottom: 15px;
			color: #94a3b8;
			font-size: 52px;
		}

		.user-event-empty h2 {
			margin: 0 0 10px;
			color: #1e293b;
			font-size: 22px;
		}

		.user-event-empty p {
			margin: 0;
			color: #64748b;
		}

		@media (max-width: 960px) {
			.user-event-grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
		}

		@media (max-width: 640px) {
			.user-event-page {
				padding: 45px 18px 70px;
			}

			.user-event-tabs {
				justify-content: flex-start;
				overflow-x: auto;
			}

			.user-event-tabs a {
				min-width: 140px;
				padding: 16px 12px;
				white-space: nowrap;
			}

			.user-event-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>

	<main class="user-event-page">

		<section class="user-event-title-area">
			<h1>이벤트</h1>
			<p>SkyRoute에서 준비한 다양한 이벤트를 확인해 보세요.</p>
		</section>

		<nav class="user-event-tabs" aria-label="이벤트 메뉴">
			<a th:href="@{/member/event/list}" class="is-active">이벤트 목록</a>
			<a th:href="@{/member/event/ended}">종료된 이벤트</a>
			<a th:href="@{/member/event/winner}">당첨자 발표</a>
		</nav>

		<section th:if="${eventList != null and !eventList.isEmpty()}"
				 class="user-event-grid">

			<article th:each="event : ${eventList}" class="user-event-card">
				<a th:href="@{/member/event/detail(event_id=${event.event_id})}">

					<div class="user-event-image">
						<img th:src="@{/assets/upload/{filename}(filename=${event.image_url})}"
							 th:alt="${event.title}">
						<span class="user-event-badge"
							  th:text="${event.event_status == 'SCHEDULED' ? '진행 예정' : '진행 중'}">
							진행 중
						</span>
					</div>

					<div class="user-event-info">
						<h2 th:text="${event.title}">이벤트명</h2>

						<p class="user-event-period">
							<span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>
							<span th:text="${#dates.format(event.start_date, 'yyyy.MM.dd')
											+ ' ~ '
											+ #dates.format(event.end_date, 'yyyy.MM.dd')}">
								2026.07.01 ~ 2026.07.31
							</span>
						</p>
					</div>

				</a>
			</article>

		</section>

		<section th:if="${eventList == null or eventList.isEmpty()}"
				 class="user-event-empty">
			<span class="material-symbols-outlined" aria-hidden="true">event_busy</span>
			<h2>진행 중인 이벤트가 없습니다.</h2>
			<p>새로운 이벤트가 등록되면 이곳에서 확인할 수 있습니다.</p>
		</section>

	</main>

</th:block>

</body>
</html>
