<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYROUTE 관리자 로그인</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

    <style>
        :root {
            --navy-950: #071c3c;
            --navy-900: #0b2859;
            --blue-700: #174fbb;
            --blue-600: #2468de;
            --text-main: #17233d;
            --text-sub: #667085;
            --text-light: #98a2b3;
            --line: #d9e0ea;
            --error: #d92d20;
            --error-bg: #fff4f2;
            --error-line: #fda29b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-width: 320px;
            font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
            color: var(--text-main);
            background: #ffffff;
        }

        /* 데스크톱: 왼쪽 이미지 50% / 오른쪽 로그인 50% */
        .admin-login-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            overflow: hidden;
        }

        /* 왼쪽 항공기 날개 이미지 */
        .visual-panel {
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #0b4f91;
            background-image: url("/assets/images/skyroute-admin-wing.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
        }

        /* 오른쪽 로그인 영역 */
        .login-panel {
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px clamp(36px, 5vw, 88px);
            background:
                radial-gradient(circle at 100% 0%, rgba(36, 104, 222, 0.07), transparent 33%),
                #ffffff;
            overflow-y: auto;
        }

        .login-content {
            width: min(100%, 480px);
            margin: auto;
        }

        /* SKYROUTE 브랜드 */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 50px;
        }

        .brand-mark {
            width: 60px;
            height: 60px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            color: #ffffff;
            background: linear-gradient(145deg, var(--blue-600), var(--navy-900));
            border-radius: 18px 18px 18px 5px;
            box-shadow: 0 14px 30px rgba(23, 79, 187, 0.24);
        }

        .brand-mark .material-symbols-outlined {
            font-size: 33px;
            transform: rotate(-8deg);
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-copy strong {
            color: var(--navy-950);
            font-size: 29px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .brand-copy small {
            margin-top: 8px;
            color: var(--text-light);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.1px;
        }

        .login-heading {
            text-align: center;
        }

        .login-heading h1 {
            margin: 0;
            color: var(--navy-950);
            font-size: 31px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -1px;
        }

        .login-heading p {
            margin: 13px 0 0;
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.7;
        }

        /* 서버 오류 영역은 높이를 유지해 폼 흔들림을 방지 */
        .server-alert {
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 26px 0 10px;
            padding: 9px 13px;
            color: var(--error);
            background: var(--error-bg);
            border: 1px solid var(--error-line);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: opacity 0.15s ease, visibility 0.15s ease;
        }

        .server-alert.is-empty,
        .server-alert.is-hidden {
            visibility: hidden;
            opacity: 0;
        }

        /* 입력칸 */
        .form-field {
            margin: 0;
        }

        .form-field label {
            display: block;
            margin: 0 0 7px;
            color: #344054;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .material-symbols-outlined {
            position: absolute;
            top: 50%;
            left: 19px;
            color: #a4acb9;
            font-size: 23px;
            transform: translateY(-50%);
            pointer-events: none;
            transition: color 0.18s ease;
        }

        .login-input {
            width: 100%;
            height: 58px;
            padding: 0 18px 0 54px;
            color: var(--text-main);
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 11px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .login-input:hover {
            border-color: #b8c2d0;
        }

        .login-input:focus {
            border-color: var(--blue-600);
            box-shadow: 0 0 0 4px rgba(36, 104, 222, 0.11);
        }

        .input-wrap:focus-within .material-symbols-outlined {
            color: var(--blue-600);
        }

        .login-input::placeholder {
            color: #a6aeba;
        }

        /* 메시지 공간은 작게 고정해 아이디/비밀번호 간격을 좁힘 */
        .field-error {
            height: 16px;
            margin: 2px 0 0;
            color: var(--error);
            font-size: 11px;
            line-height: 16px;
        }

        .login-button {
            width: 100%;
            height: 58px;
            margin-top: 15px;
            padding: 0;
            color: #ffffff;
            background: linear-gradient(100deg, var(--blue-700), var(--navy-900));
            border: 0;
            border-radius: 11px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 13px 27px rgba(16, 58, 125, 0.23);
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        }

        .login-button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 17px 32px rgba(16, 58, 125, 0.28);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin: 29px 0 0;
            color: #8d96a6;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.1px;
        }

        .security-note .material-symbols-outlined {
            color: #8793a6;
            font-size: 19px;
        }

        .footer-copy {
            margin: 78px 0 0;
            color: #9aa3b2;
            font-size: 11px;
            text-align: center;
        }

        /* 화면이 좁으면 위 이미지 / 아래 로그인으로 전환 */
        @media (max-width: 820px) {
            .admin-login-page {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(320px, 46vh) auto;
                overflow: visible;
            }

            .visual-panel {
                min-height: 320px;
                background-size: cover;
                background-position: center 53%;
            }

            .login-panel {
                min-height: auto;
                padding: 52px 32px 34px;
            }

            .brand {
                margin-bottom: 40px;
            }

            .footer-copy {
                margin-top: 52px;
            }
        }

        @media (max-width: 560px) {
            .admin-login-page {
                grid-template-rows: 260px auto;
            }

            .visual-panel {
                min-height: 260px;
                background-position: center 62%;
            }

            .login-panel {
                padding: 42px 24px 28px;
            }

            .brand {
                margin-bottom: 34px;
            }

            .brand-mark {
                width: 52px;
                height: 52px;
            }

            .brand-copy strong {
                font-size: 24px;
            }

            .brand-copy small {
                font-size: 9px;
            }

            .login-heading h1 {
                font-size: 27px;
            }

            .login-input,
            .login-button {
                height: 54px;
            }
        }
    </style>
</head>
<body>
<div class="admin-login-page">

    <!-- 왼쪽 50%: 생성한 SKYROUTE 항공기 날개 이미지 -->
    <section class="visual-panel"
             aria-label="구름 위를 비행하는 항공기 날개 이미지"></section>

    <!-- 오른쪽 50%: 관리자 로그인 -->
    <main class="login-panel">
        <div class="login-content">

            <header class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <span class="material-symbols-outlined">flight_takeoff</span>
                </div>
                <div class="brand-copy">
                    <strong>SKYROUTE</strong>
                    <small>ADMIN CONSOLE</small>
                </div>
            </header>

            <section class="login-heading">
                <h1>관리자 시스템</h1>
                <p>관리자 전용 시스템에 로그인하세요.</p>
            </section>

            <form th:action="@{/member/login}"
                  id="member_login"
                  method="post"
                  novalidate>

                <div class="server-alert error-invalid"
                     th:classappend="${error == null} ? ' is-empty' : ''"
                     aria-live="polite">
                    <span th:if="${error == 'error'}">
                        아이디 또는 비밀번호가 일치하지 않습니다.
                    </span>
                    <span th:if="${error == 'error_suspended'}">
                        정지된 계정입니다.
                    </span>
                    <span th:if="${error == 'error_deleted'}">
                        탈퇴 또는 비활성화된 계정입니다.
                    </span>
                    <span th:if="${error == 'error_user_not_allowed'}">
                        관리자 또는 지상직 계정만 로그인할 수 있습니다.
                    </span>
                </div>

                <div class="form-field">
                    <label for="id">아이디</label>
                    <div class="input-wrap">
                        <span class="material-symbols-outlined" aria-hidden="true">person</span>
                        <input type="text"
                               id="id"
                               name="id"
                               class="login-input"
                               placeholder="아이디를 입력하세요"
                               autocomplete="username"
                               aria-describedby="error_id">
                    </div>
                    <p id="error_id" class="field-error"></p>
                </div>

                <div class="form-field">
                    <label for="passwd">비밀번호</label>
                    <div class="input-wrap">
                        <span class="material-symbols-outlined" aria-hidden="true">lock</span>
                        <input type="password"
                               id="passwd"
                               name="password"
                               class="login-input"
                               placeholder="비밀번호를 입력하세요"
                               autocomplete="current-password"
                               aria-describedby="error_passwd">
                    </div>
                    <p id="error_passwd" class="field-error"></p>
                </div>

                <button type="submit" class="login-button">로그인</button>

                <p class="security-note">
                    <span class="material-symbols-outlined" aria-hidden="true">verified_user</span>
                    ADMIN · STAFF AUTHORIZED ONLY
                </p>
            </form>

            <footer class="footer-copy">
                &copy; 2026 SKYROUTE. All rights reserved.
            </footer>
        </div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("member_login");
        const idInput = document.getElementById("id");
        const passwordInput = document.getElementById("passwd");
        const idError = document.getElementById("error_id");
        const passwordError = document.getElementById("error_passwd");
        const serverAlert = document.querySelector(".error-invalid");

        if (!form || !idInput || !passwordInput) {
            return;
        }

        function hideServerError() {
            if (serverAlert) {
                serverAlert.classList.add("is-hidden");
            }
        }

        function clearClientErrors() {
            idError.textContent = "";
            passwordError.textContent = "";
        }

        form.addEventListener("submit", function (event) {
            const idValue = idInput.value.trim();
            const passwordValue = passwordInput.value.trim();

            clearClientErrors();
            hideServerError();

            if (idValue !== "" && passwordValue !== "") {
                return;
            }

            event.preventDefault();

            if (idValue === "") {
                idError.textContent = "아이디를 입력하세요.";
            }

            if (passwordValue === "") {
                passwordError.textContent = "비밀번호를 입력하세요.";
            }

            if (idValue === "") {
                idInput.focus();
            } else {
                passwordInput.focus();
            }
        });

        idInput.addEventListener("input", function () {
            idError.textContent = "";
            hideServerError();
        });

        passwordInput.addEventListener("input", function () {
            passwordError.textContent = "";
            hideServerError();
        });
    });
</script>
</body>
</html>
