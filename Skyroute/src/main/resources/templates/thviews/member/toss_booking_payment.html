<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, initial-scale=1.0">

	<title>토스 결제 | SkyRoute</title>

	<meta name="_csrf"
		  th:content="${_csrf != null} ? ${_csrf.token} : ''">

	<meta name="_csrf_header"
		  th:content="${_csrf != null} ? ${_csrf.headerName} : ''">

	<script src="https://js.tosspayments.com/v2/standard"></script>

	<style>
		:root {
			--charcoal: #1a1a1a;
			--background: #f5f4f0;
			--coral: #d85a30;
			--line: #e3e1da;
			--muted: #6b6b6b;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--background);
			color: var(--charcoal);
			font-family: "Noto Sans KR", system-ui, sans-serif;
		}

		.wrap {
			max-width: 560px;
			margin: 70px auto;
			padding: 0 20px;
		}

		.card {
			padding: 32px 26px;
			border: 1px solid var(--line);
			border-radius: 16px;
			background: #fff;
			text-align: center;
		}

		h1 {
			margin: 0 0 12px;
			font-size: 22px;
		}

		.description {
			margin: 0;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.7;
		}

		.order-info {
			margin: 24px 0;
			padding: 16px;
			border-radius: 12px;
			background: #f8fafc;
			text-align: left;
		}

		.row {
			display: flex;
			justify-content: space-between;
			gap: 15px;
			padding: 6px 0;
			font-size: 14px;
		}

		.label {
			color: var(--muted);
		}

		.amount {
			color: var(--coral);
			font-weight: 700;
		}

		.loading {
			width: 36px;
			height: 36px;
			margin: 22px auto;
			border: 4px solid #e5e7eb;
			border-top-color: var(--coral);
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		.retry-button {
			display: none;
			width: 100%;
			margin-top: 18px;
			padding: 15px;
			border: 0;
			border-radius: 11px;
			background: var(--charcoal);
			color: #fff;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
		}

		.error-message {
			display: none;
			margin-top: 16px;
			color: #b91c1c;
			font-size: 13px;
			line-height: 1.6;
		}

		.timer {
			margin-top: 18px;
			color: var(--muted);
			font-size: 13px;
		}

		.timer strong {
			color: var(--coral);
		}
	</style>
</head>

<body>

<div class="wrap"
	 th:attr="
		data-booking-id=${booking.bookingId},
		data-payment-method=${paymentMethod},
		data-hold-minutes=${holdMinutes}
	 ">

	<div class="card">

		<h1 th:text="${paymentMethod == 'TOSSPAY'}
			? '토스페이 결제'
			: '계좌이체 결제'">
			토스 결제
		</h1>

		<p id="statusMessage"
		   class="description">
			결제창을 준비하고 있습니다.
		</p>

		<div class="order-info">

			<div class="row">
				<span class="label">예약번호</span>

				<span th:text="${booking.bookingNo}">
					SH-0000
				</span>
			</div>

			<div class="row">
				<span class="label">결제수단</span>

				<span th:text="${paymentMethod == 'TOSSPAY'}
					? '토스페이'
					: '퀵계좌이체'">
					토스페이
				</span>
			</div>

			<div class="row">
				<span class="label">결제금액</span>

				<span class="amount"
					  th:text="${#numbers.formatInteger(
						booking.totalAmount,
						0,
						'COMMA'
					  ) + '원'}">
					0원
				</span>
			</div>

		</div>

		<div id="loading"
			 class="loading">
		</div>

		<p class="timer">
			좌석 선점 만료까지
			<strong id="timer">10:00</strong>
		</p>

		<p id="errorMessage"
		   class="error-message">
		</p>

		<button type="button"
				id="retryButton"
				class="retry-button">
			결제창 다시 열기
		</button>

	</div>

</div>

<script>
(() => {
	"use strict";

	const root =
		document.querySelector(".wrap");

	const bookingId =
		Number(root.dataset.bookingId);

	const paymentMethod =
		root.dataset.paymentMethod;

	const holdMinutes =
		Number(root.dataset.holdMinutes || 10);

	const csrfToken =
		document.querySelector(
			'meta[name="_csrf"]'
		)?.content || "";

	const csrfHeader =
		document.querySelector(
			'meta[name="_csrf_header"]'
		)?.content || "";

	const loading =
		document.getElementById("loading");

	const statusMessage =
		document.getElementById("statusMessage");

	const errorMessage =
		document.getElementById("errorMessage");

	const retryButton =
		document.getElementById("retryButton");

	const timer =
		document.getElementById("timer");

	let opening = false;

	async function postJson(url, body) {
		const headers = {
			"Content-Type": "application/json"
		};

		if (csrfHeader) {
			headers[csrfHeader] = csrfToken;
		}

		const response = await fetch(
			url,
			{
				method: "POST",
				headers,
				body: JSON.stringify(body)
			}
		);

		const contentType =
			response.headers.get(
				"content-type"
			) || "";

		let data;

		if (contentType.includes(
			"application/json"
		)) {
			data = await response.json();
		} else {
			data = {
				message: await response.text()
			};
		}

		if (!response.ok) {
			throw new Error(
				data.message
				|| "요청 처리에 실패했습니다."
			);
		}

		return data;
	}

	async function openTossPayment() {
		if (opening) {
			return;
		}

		opening = true;

		loading.style.display = "block";
		errorMessage.style.display = "none";
		retryButton.style.display = "none";

		statusMessage.textContent =
			"결제창을 준비하고 있습니다.";

		try {
			const prepare =
				await postJson(
					"/booking/reserve/toss/prepare",
					{
						bookingId,
						method: paymentMethod
					}
				);

			if (!prepare.clientKey
					|| !prepare.orderId
					|| !prepare.totalAmount) {

				throw new Error(
					"토스 결제 준비 정보가 올바르지 않습니다."
				);
			}

			const tossPayments =
				TossPayments(
					prepare.clientKey
				);

			const payment =
				tossPayments.payment({
					customerKey:
						prepare.customerKey
				});

			const successUrl =
				window.location.origin
				+ "/booking/reserve/toss/success"
				+ "?bookingId="
				+ bookingId;

			const failUrl =
				window.location.origin
				+ "/booking/reserve/toss/fail"
				+ "?bookingId="
				+ bookingId;

			const commonRequest = {
				amount: {
					currency: "KRW",
					value: Number(
						prepare.totalAmount
					)
				},
				orderId: prepare.orderId,
				orderName: prepare.orderName,
				successUrl,
				failUrl
			};

			statusMessage.textContent =
				paymentMethod === "TOSSPAY"
				? "토스페이 결제창을 열고 있습니다."
				: "퀵계좌이체 결제창을 열고 있습니다.";

			if (paymentMethod === "TOSSPAY") {

				await payment.requestPayment({
					...commonRequest,
					method: "CARD",
					card: {
						flowMode: "DIRECT",
						easyPay: "TOSSPAY"
					}
				});

				return;
			}

			if (paymentMethod === "TRANSFER") {

				await payment.requestPayment({
					...commonRequest,
					method: "TRANSFER"
				});

				return;
			}

			throw new Error(
				"지원하지 않는 결제수단입니다."
			);

		} catch (error) {
			console.error(
				"토스 결제창 실행 오류:",
				error
			);

			opening = false;

			loading.style.display = "none";

			statusMessage.textContent =
				"결제창을 열지 못했습니다.";

			errorMessage.textContent =
				error.message
				|| "토스 결제창 실행 중 오류가 발생했습니다.";

			errorMessage.style.display =
				"block";

			retryButton.style.display =
				"block";
		}
	}

	retryButton.addEventListener(
		"click",
		openTossPayment
	);

	let remain =
		holdMinutes * 60;

	const intervalId =
		window.setInterval(
			() => {
				remain -= 1;

				if (remain <= 0) {
					window.clearInterval(
						intervalId
					);

					timer.textContent =
						"00:00";

					retryButton.disabled =
						true;

					window.alert(
						"좌석 선점 시간이 만료되었습니다."
					);

					window.location.href =
						"/main/home";

					return;
				}

				const minute =
					String(
						Math.floor(
							remain / 60
						)
					).padStart(2, "0");

				const second =
					String(
						remain % 60
					).padStart(2, "0");

				timer.textContent =
					minute + ":" + second;
			},
			1000
		);

	window.addEventListener(
		"load",
		openTossPayment,
		{ once: true }
	);
})();
</script>

</body>
</html>
