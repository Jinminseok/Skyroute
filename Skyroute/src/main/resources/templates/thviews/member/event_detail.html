<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout_basic}">
<head>
<meta charset="UTF-8">
<title th:text="${event.title} + ' - 이벤트'">이벤트</title>

<link rel="stylesheet" th:href="@{/assets/css/member.css}">

<style>
.event-detail-wrap {
	max-width: 980px;
	margin: 0 auto;
	padding: 54px 0 80px;
}

.event-detail-card {
	overflow: hidden;
	background: #fff;
	border: 1px solid var(--line);
	border-radius: 18px;
	box-shadow: var(--sh);
}

.event-detail-image {
	display: block;
	width: 100%;
	height: 430px;
	object-fit: cover;
}

.event-detail-image-empty {
	display: flex;
	align-items: center;
	justify-content: center;
	width: 100%;
	height: 430px;
	background: #f1f5f9;
	color: #94a3b8;
}

.event-detail-image-empty .material-symbols-outlined {
	font-size: 64px;
}

.event-detail-body {
	padding: 38px 42px 42px;
}

.event-detail-label {
	display: inline-flex;
	align-items: center;
	height: 28px;
	padding: 0 12px;
	border-radius: 999px;
	background: var(--accent-soft);
	color: var(--accent);
	font-family: var(--sans-eng);
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 1.2px;
}

.event-status-area {
	display: flex;
	align-items: center;
	gap: 8px;
	margin-top: 16px;
}

.event-status {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 7px 13px;
	border-radius: 999px;
	font-size: 13px;
	font-weight: 700;
}

.event-status-scheduled {
	background: #fff7ed;
	color: #c2410c;
}

.event-status-ongoing {
	background: #ecfdf5;
	color: #047857;
}

.event-status-ended {
	background: #f1f5f9;
	color: #64748b;
}

.event-detail-title {
	margin: 16px 0 12px;
	color: var(--ink-700);
	font-size: 34px;
	font-weight: 600;
	letter-spacing: -1px;
}

.event-detail-period {
	display: flex;
	gap: 8px;
	color: var(--mut);
	font-family: var(--sans-eng);
	font-size: 14px;
}

.event-detail-content {
	min-height: 180px;
	margin-top: 32px;
	padding-top: 30px;
	border-top: 1px solid var(--line);
	color: var(--ink);
	font-size: 16px;
	line-height: 1.9;
	white-space: pre-wrap;
}

.event-detail-actions {
	display: flex;
	justify-content: flex-end;
	gap: 10px;
	margin-top: 34px;
}

.event-message {
	margin-bottom: 20px;
	padding: 13px 16px;
	border-radius: 10px;
	background: var(--accent-soft);
	color: var(--accent);
	font-size: 14px;
}

.event-result-box {
	margin-top: 28px;
	padding: 20px;
	border: 1px solid var(--line);
	border-radius: 12px;
	background: #fbfdff;
}

.event-result-title {
	margin-bottom: 8px;
	font-size: 14px;
	font-weight: 700;
}

.event-result-text {
	margin: 0;
	font-size: 14px;
	line-height: 1.6;
}

.event-result-scheduled {
	border-color: #fed7aa;
	background: #fff7ed;
	color: #c2410c;
}

.event-result-pending {
	border-color: #bfdbfe;
	background: #eff6ff;
	color: #1d4ed8;
}

.event-result-winner {
	border-color: #a7f3d0;
	background: #ecfdf5;
	color: #047857;
}

.event-result-not-selected {
	border-color: #e2e8f0;
	background: #f8fafc;
	color: #475569;
}

@media (max-width: 860px) {
	.event-detail-wrap {
		padding: 36px 16px 56px;
	}

	.event-detail-image,
	.event-detail-image-empty {
		height: 280px;
	}

	.event-detail-body {
		padding: 28px 24px;
	}

	.event-detail-title {
		font-size: 27px;
	}

	.event-detail-actions {
		flex-wrap: wrap;
	}
}
</style>
</head>

<body>

<div layout:fragment="panel" class="panel on">

	<section class="wrap event-detail-wrap">

		<div th:if="${message}"
		     class="event-message"
		     th:text="${message}">
		</div>

		<div class="event-detail-card">

			<img th:if="${event.image_url != null and !#strings.isEmpty(event.image_url)}"
			     th:src="@{/assets/upload/{file}(file=${event.image_url})}"
			     th:alt="${event.title}"
			     class="event-detail-image">

			<div th:unless="${event.image_url != null and !#strings.isEmpty(event.image_url)}"
			     class="event-detail-image-empty">
				<span class="material-symbols-outlined" aria-hidden="true">image</span>
			</div>

			<div class="event-detail-body">

				<span class="event-detail-label">EVENT</span>

				<div class="event-status-area">
					<span th:if="${scheduledEvent}"
					      class="event-status event-status-scheduled">
						진행 예정
					</span>

					<span th:if="${activeEvent}"
					      class="event-status event-status-ongoing">
						진행 중
					</span>

					<span th:if="${!scheduledEvent and !activeEvent}"
					      class="event-status event-status-ended">
						종료
					</span>
				</div>

				<h1 class="event-detail-title"
				    th:text="${event.title}">
				</h1>

				<div class="event-detail-period">
					<span th:text="${#dates.format(event.start_date, 'yyyy.MM.dd')}"></span>
					<span>~</span>
					<span th:text="${#dates.format(event.end_date, 'yyyy.MM.dd')}"></span>
				</div>

				<div class="event-detail-content"
				     th:text="${event.content}">
				</div>

				<div th:if="${scheduledEvent and !participated}"
				     class="event-result-box event-result-scheduled">
					<div class="event-result-title">이벤트 진행 예정</div>
					<p class="event-result-text">
						아직 이벤트 참여 기간이 아닙니다.
						<span th:text="${#dates.format(event.start_date, 'yyyy.MM.dd')}"></span>
						부터 참여할 수 있습니다.
					</p>
				</div>

				<div th:if="${participated
				             and participation != null
				             and (participation.result_status == null
				                  or participation.result_status == 'APPLIED')}"
				     class="event-result-box event-result-pending">
					<div class="event-result-title">결과 발표 대기</div>
					<p class="event-result-text">
						응모가 완료되었습니다. 이벤트 종료 후 랜덤 추첨 결과가 발표됩니다.
					</p>
				</div>

				<div th:if="${participated
				             and participation != null
				             and participation.result_status == 'WINNER'}"
				     class="event-result-box event-result-winner">
					<div class="event-result-title">당첨</div>
					<p class="event-result-text">
						축하합니다. 이벤트 당첨자로 선정되었습니다.
					</p>
				</div>

				<div th:if="${participated
				             and participation != null
				             and participation.result_status == 'NOT_SELECTED'}"
				     class="event-result-box event-result-not-selected">
					<div class="event-result-title">미당첨</div>
					<p class="event-result-text">
						아쉽지만 이번 이벤트에는 선정되지 않았습니다.
					</p>
				</div>

				<div th:if="${event.result_status == 'ANNOUNCED'
				             and event.result_announced_at != null}"
				     class="event-result-box"
				     style="margin-top:14px; padding:14px 20px;">
					<div class="event-result-title">결과 발표일</div>
					<p class="event-result-text">
						<span th:text="${#dates.format(
							event.result_announced_at,
							'yyyy.MM.dd'
						)}"></span>
					</p>
				</div>

				<div class="event-detail-actions">

					<a th:href="@{/member/event/list}"
					   class="btn ghost">
						이벤트 목록
					</a>

					<form sec:authorize="isAuthenticated()"
					      th:if="${activeEvent and !participated}"
					      th:action="@{/member/event/participate}"
					      method="post"
					      onsubmit="return confirm('이 이벤트에 참여하시겠습니까?');">

						<input type="hidden"
						       name="event_id"
						       th:value="${event.event_id}">

						<input type="hidden"
						       th:if="${_csrf != null}"
						       th:name="${_csrf.parameterName}"
						       th:value="${_csrf.token}">

						<button type="submit" class="btn">
							이벤트 참여하기
						</button>
					</form>

					<button sec:authorize="isAuthenticated()"
					        th:if="${activeEvent and participated}"
					        type="button"
					        class="btn ghost"
					        disabled
					        style="cursor:default; opacity:.7;">
						참여 완료
					</button>

					<button sec:authorize="isAuthenticated()"
					        th:if="${!activeEvent
					               and !scheduledEvent
					               and participated
					               and event.result_status != 'ANNOUNCED'}"
					        type="button"
					        class="btn ghost"
					        disabled
					        style="cursor:default; opacity:.7;">
						응모 마감
					</button>

					<button sec:authorize="isAuthenticated()"
					        th:if="${!activeEvent
					               and participated
					               and event.result_status == 'ANNOUNCED'}"
					        type="button"
					        class="btn ghost"
					        disabled
					        style="cursor:default; opacity:.7;">
						결과 발표 완료
					</button>

					<a sec:authorize="isAnonymous()"
					   th:if="${activeEvent}"
					   th:href="@{/member/login}"
					   class="btn">
						로그인 후 참여하기
					</a>

				</div>

			</div>
		</div>

	</section>

</div>

</body>
</html>
