<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout_basic}">
<head>
<title>회원 가입</title>
<link rel="stylesheet" th:href="@{/assets/css/member.css}">
<script type="text/javascript" th:src="@{/assets/js/jquery-3.7.1.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/member.register.js}"></script>
<style>
   /* 에어누리 서식 전용 가드 스타일 */
   .register-box {
      max-width: 540px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--sh);
   }
   .form-group {
      margin-bottom: 20px;
   }
   .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
   }
   /* 기존 인풋 인라인 스타일을 에어누리 스타일로 바인딩 */
   .form-control {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      color: var(--ink);
      box-sizing: border-box;
      transition: border-color 0.2s;
   }
   .form-control:focus {
      outline: none;
      border-color: var(--accent);
   }
   /* 버튼 라인업 정렬 */
   .input-btn-group {
      display: flex;
      gap: 8px;
   }
   /* 타임리프 에러 메시지 텍스트 인라인 처리 */
   .error-msg {
      display: block;
      font-size: 12px;
      color: var(--bad);
      margin-top: 5px;
      padding-left: 2px;
   }
   /* 아이디 중복확인 완료 등 가이드 메시지 */
   #message_id {
      display: block;
      font-size: 12px;
      margin-top: 5px;
      padding-left: 2px;
   }
</style>
</head>
<body>
<div layout:fragment="panel" class="page-main">
   
   <!-- [MAIN WRAP] 상단 레이아웃 그리드 여백 맞춤 -->
   <div class="wrap" style="padding-top: 50px; padding-bottom: 80px;">
      
      <!-- 타이틀 구역 -->
      <div class="htitle" style="margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%;">
         <div>
            <div class="eyebrow" style="justify-content: center; margin: 0 auto;">JOIN AS A MEMBER</div>
            <h2 style="font-size: 24px; font-weight: 600; margin-top: 5px; text-align: center;">에어누리 회원가입</h2>
            <p style="font-size: 14px; color: var(--mut); margin-top: 6px; text-align: center;">회원이 되시면 더 다양한 여정 관리와 마일리지 혜택을 누리실 수 있습니다.</p>
         </div>
      </div>

      <!-- 🌟 에어누리 컨셉 전용 가드 박스 시작 -->
      <div class="register-box">
         <form th:action="@{registerUser}" th:object="${memberVO}" id="member_register" method="post">
            
            <!-- 1. 아이디 -->
            <div class="form-group">
               <label for="id">아이디</label>
               <div class="input-btn-group">
                  <input type="text" th:field="*{id}" placeholder="영문, 숫자 4~12자" autocomplete="off" th:errorclass="field-error" class="form-control">
                  <input type="button" id="confirm_id" value="중복체크" class="btn ghost sm" style="min-width: 100px; height: 42px; border-radius: 8px;">
               </div>
               <span id="message_id"></span>
               <span th:errors="*{id}" class="error-msg"></span>
            </div>

            <!-- 2. 이름 -->
            <div class="form-group">
               <label for="name">이름</label>
               <input type="text" th:field="*{name}" th:errorclass="field-error" class="form-control" placeholder="성함을 입력해주세요">            
               <span th:errors="*{name}" class="error-msg"></span>
            </div>

            <!-- 3. 비밀번호 -->
            <div class="form-group">
               <label for="password">비밀번호</label>
               <input type="password" th:field="*{password}" th:errorclass="field-error" class="form-control" placeholder="비밀번호를 입력해주세요">            
               <span th:errors="*{password}" class="error-msg"></span>
            </div>

            <!-- 4. 전화번호 -->
            <div class="form-group">
               <label for="phone">전화번호</label>
               <input type="text" th:field="*{phone}" th:errorclass="field-error" class="form-control" placeholder="EX) 010-1234-5678">            
               <span th:errors="*{phone}" class="error-msg"></span>
            </div>

            <!-- 5. 이메일 -->
            <div class="form-group">
               <label for="email">이메일</label>
               <input type="text" th:field="*{email}" th:errorclass="field-error" class="form-control" placeholder="EX) airnuri@sky.com">            
               <span th:errors="*{email}" class="error-msg"></span>
            </div>

            <!-- 6. 우편번호 -->
            <div class="form-group">
               <label for="zipcode">우편번호</label>
               <div class="input-btn-group">
                  <input type="text" th:field="*{zipcode}" th:errorclass="field-error" class="form-control" readonly placeholder="우편번호">            
                  <input type="button" onclick="execDaumPostcode()" value="우편번호 찾기" class="btn ghost sm" style="min-width: 110px; height: 42px; border-radius: 8px;">
               </div>
               <span th:errors="*{zipcode}" class="error-msg"></span>
            </div>

            <!-- 7. 주소 -->
            <div class="form-group">
               <label for="address1">주소</label>
               <input type="text" th:field="*{address1}" th:errorclass="field-error" class="form-control" readonly placeholder="기본 주소">            
               <span th:errors="*{address1}" class="error-msg"></span>
            </div>

            <!-- 8. 상세 주소 -->
            <div class="form-group" style="margin-bottom: 35px;">
               <label for="address2">상세 주소</label>
               <input type="text" th:field="*{address2}" th:errorclass="field-error" class="form-control" placeholder="상세 주소를 입력해주세요">            
               <span th:errors="*{address2}" class="error-msg"></span>
            </div>

            <!-- 하단 제어 액션 바 -->
            <div style="display: flex; gap: 12px; justify-content: center;">
               <input type="submit" class="btn" value="가입하기" style="width: 50%; height: 45px; border-radius: 10px; font-weight: 600; cursor: pointer;">
               <input type="button" value="홈으로" class="btn ghost" style="width: 50%; height: 45px; border-radius: 10px; font-weight: 600; cursor: pointer;" th:onclick="|location.href='@{/main/home}'|">
            </div>
         </form>
      </div>
      <!-- register-box 끝 -->
      
   </div>
   <!-- wrap 끝 -->

   <!-- iOS 팝업 레이어 바인딩 구역 (원래 속성 그대로 유지) -->
   <div id="layer" style="display:none;position:fixed;overflow:hidden;z-index:9999;align-items:center;justify-content:center;border-radius:12px;box-shadow:var(--sh);background:#fff;">
      <img src="//t1.daumcdn.net/postcode/resource/images/close.png" id="btnCloseLayer" style="cursor:pointer;position:absolute;right:10px;top:10px;z-index:1;width:18px;" onclick="closeDaumPostcode()" alt="닫기 버튼">
   </div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    var element_layer = document.getElementById('layer');

    function closeDaumPostcode() {
        element_layer.style.display = 'none';
    }

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                var addr = ''; 
                var extraAddr = ''; 

                if (data.userSelectedType === 'R') { 
                    addr = data.roadAddress;
                } else { 
                    addr = data.jibunAddress;
                }

                if(data.userSelectedType === 'R'){
                    if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                        extraAddr += data.bname;
                    }
                    if(data.buildingName !== '' && data.apartment === 'Y'){
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    if(extraAddr !== ''){
                        extraAddr = ' (' + extraAddr + ')';
                    }
                } 

                document.getElementById('zipcode').value = data.zonecode;
                document.getElementById("address1").value = addr + extraAddr;
                document.getElementById("address2").focus();

                element_layer.style.display = 'none';
            },
            width : '100%',
            height : '100%',
            maxSuggestItems : 5
        }).embed(element_layer);

        element_layer.style.display = 'block';
        initLayerPosition();
    }

    function initLayerPosition(){
        var width = 400; // 우편번호 팝업창 크기 컨셉 매칭 보정
        var height = 480; 
        var borderWidth = 1; 

        element_layer.style.width = width + 'px';
        element_layer.style.height = height + 'px';
        element_layer.style.border = borderWidth + 'px solid var(--line)';
        element_layer.style.left = (((window.innerWidth || document.documentElement.clientWidth) - width)/2 - borderWidth) + 'px';
        element_layer.style.top = (((window.innerHeight || document.documentElement.clientHeight) - height)/2 - borderWidth) + 'px';
    }
</script>
</div>
</body>
</html>
