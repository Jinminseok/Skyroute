<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
	<meta charset="UTF-8"/>
	<title>예약 완료 | SkyRoute</title>
	<style>
		:root{--charcoal:#1A1A1A;--bg:#F5F4F0;--coral:#D85A30;--line:#e3e1da;--muted:#6b6b6b;}
		body{margin:0;background:var(--bg);color:var(--charcoal);
			font-family:"Noto Sans KR",system-ui,sans-serif;}
		.wrap{max-width:560px;margin:48px auto;padding:0 20px;text-align:center;}
		.check{width:64px;height:64px;border-radius:50%;background:var(--coral);
			color:#fff;font-size:34px;line-height:64px;margin:0 auto 18px;}
		h1{font-size:22px;margin:0 0 6px;}
		.sub{color:var(--muted);font-size:14px;margin-bottom:26px;}
		.card{background:#fff;border:1px solid var(--line);border-radius:14px;
			padding:24px;text-align:left;}
		.row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;}
		.row .label{color:var(--muted);}
		.amt{color:var(--coral);font-weight:700;}
		.btns{margin-top:24px;display:flex;gap:10px;justify-content:center;}
		a.btn{display:inline-block;padding:13px 22px;border-radius:10px;
			text-decoration:none;font-size:14px;font-weight:600;}
		.btn-dark{background:var(--charcoal);color:#fff;}
		.btn-line{border:1.5px solid var(--line);color:var(--charcoal);}
	</style>
</head>
<body>
<div class="wrap">
	<div class="check">✓</div>
	<h1>예약이 확정되었습니다</h1>
	<p class="sub">결제가 정상 처리되어 좌석이 확정 배정되었습니다.</p>

	<div class="card">
		<div class="row">
			<span class="label">예약번호</span>
			<span th:text="${booking.bookingNo}">SH-XXXX</span>
		</div>
		<div class="row">
			<span class="label">여정</span>
			<span th:text="${booking.outboundDepartureIata} + ' → ' + ${booking.outboundArrivalIata}">ICN → CJU</span>
		</div>
		<div class="row">
			<span class="label">탑승객</span>
			<span th:text="${booking.passengerCount} + '명'">1명</span>
		</div>
		<div class="row">
			<span class="label">결제금액</span>
			<span class="amt" th:text="${#numbers.formatInteger(booking.totalAmount,0,'COMMA')} + '원'">0원</span>
		</div>
	</div>

	<div class="btns">
		<a class="btn btn-dark" th:href="@{/mypage/booking}">예약 내역 보기</a>
		<a class="btn btn-line" th:href="@{/main/home}">홈으로</a>
	</div>
</div>
</body>
</html>
