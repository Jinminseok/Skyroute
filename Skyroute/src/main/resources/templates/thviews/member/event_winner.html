<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/layout_basic}">
<head>
	<meta charset="UTF-8">
	<title>당첨자 발표</title>
</head>
<body>

<th:block layout:fragment="panel">

	<style>
		.user-event-page {
			max-width: 1200px;
			margin: 0 auto;
			padding: 70px 24px 100px;
		}

		.user-event-title-area {
			margin-bottom: 42px;
			text-align: center;
		}

		.user-event-title-area h1 {
			margin: 0 0 14px;
			color: #111827;
			font-size: 38px;
			font-weight: 800;
		}

		.user-event-title-area p {
			margin: 0;
			color: #64748b;
			font-size: 16px;
		}

		.user-event-tabs {
			display: flex;
			justify-content: center;
			gap: 38px;
			margin-bottom: 50px;
			border-bottom: 1px solid #dbe3ec;
		}

		.user-event-tabs a {
			position: relative;
			min-width: 0;
			padding: 19px 4px;
			color: #64748b;
			font-size: 16px;
			font-weight: 600;
			text-align: center;
			text-decoration: none;
			white-space: nowrap;
		}

		.user-event-tabs a:hover {
			color: #0066e2;
		}

		.user-event-tabs a.is-active {
			color: #0066e2;
			font-weight: 800;
		}

		.user-event-tabs a.is-active::after {
			position: absolute;
			right: 4px;
			bottom: -1px;
			left: 4px;
			height: 3px;
			border-radius: 3px 3px 0 0;
			background: #0066e2;
			content: "";
		}

		.winner-list-title {
			margin-bottom: 22px;
			color: #172033;
			font-size: 26px;
			font-weight: 800;
		}

		.winner-search-form {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			margin-bottom: 34px;
			padding: 25px;
			border-radius: 14px;
			background: #f8fafc;
		}

		.winner-search-input {
			width: 460px;
			height: 48px;
			padding: 0 16px;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			background: #ffffff;
			color: #172033;
			font-size: 15px;
			outline: none;
			box-sizing: border-box;
		}

		.winner-search-input:focus {
			border-color: #0066e2;
			box-shadow: 0 0 0 3px rgba(0, 102, 226, 0.1);
		}

		.winner-search-button,
		.winner-reset-button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			height: 48px;
			padding: 0 24px;
			border-radius: 8px;
			font-size: 15px;
			font-weight: 700;
			text-decoration: none;
			cursor: pointer;
			box-sizing: border-box;
		}

		.winner-search-button {
			border: 1px solid #0066e2;
			background: #0066e2;
			color: #ffffff;
		}

		.winner-search-button:hover {
			background: #0057c2;
		}

		.winner-reset-button {
			border: 1px solid #cbd5e1;
			background: #ffffff;
			color: #475569;
		}

		.winner-reset-button:hover {
			border-color: #94a3b8;
			background: #f8fafc;
		}

		.winner-result-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 14px;
		}

		.winner-result-count {
			color: #64748b;
			font-size: 14px;
		}

		.winner-result-count strong {
			color: #0066e2;
			font-size: 16px;
		}

		.winner-table-wrap {
			overflow-x: auto;
			border-top: 2px solid #172033;
			border-bottom: 1px solid #cbd5e1;
		}

		.winner-table {
			width: 100%;
			min-width: 850px;
			border-collapse: collapse;
			table-layout: fixed;
		}

		.winner-table thead {
			background: #f8fafc;
		}

		.winner-table th {
			height: 58px;
			padding: 0 16px;
			border-bottom: 1px solid #cbd5e1;
			color: #334155;
			font-size: 14px;
			font-weight: 800;
			text-align: center;
		}

		.winner-table td {
			padding: 20px 16px;
			border-bottom: 1px solid #e2e8f0;
			color: #475569;
			font-size: 14px;
			text-align: center;
			vertical-align: middle;
		}

		.winner-table tbody tr:last-child td {
			border-bottom: 0;
		}

		.winner-table tbody tr:hover {
			background: #f8fbff;
		}

		.winner-image-column {
			width: 160px;
		}

		.winner-date-column {
			width: 125px;
		}

		.winner-period-column {
			width: 210px;
		}

		.winner-thumbnail-link {
			display: block;
			width: 130px;
			height: 74px;
			margin: 0 auto;
			overflow: hidden;
			border-radius: 9px;
			background: #e2e8f0;
		}

		.winner-thumbnail-link img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform 0.25s ease;
		}

		.winner-thumbnail-link:hover img {
			transform: scale(1.05);
		}

		.winner-thumbnail-empty {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			color: #94a3b8;
			font-size: 12px;
			font-weight: 700;
		}

		.winner-title-cell {
			text-align: left !important;
		}

		.winner-title-link {
			display: block;
			overflow: hidden;
			color: #172033;
			font-size: 16px;
			font-weight: 750;
			line-height: 1.5;
			text-decoration: none;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.winner-title-link:hover {
			color: #0066e2;
			text-decoration: underline;
		}

		.winner-announced-date {
			color: #475569;
			font-weight: 600;
		}

		.winner-period {
			color: #64748b;
			line-height: 1.6;
		}

		.winner-empty-row td {
			padding: 90px 20px;
			color: #64748b;
			text-align: center !important;
		}

		.winner-empty-icon {
			display: block;
			margin-bottom: 14px;
			color: #94a3b8;
			font-size: 48px;
		}

		.winner-pagination {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			margin-top: 38px;
		}

		.winner-page-link,
		.winner-page-disabled {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 38px;
			height: 38px;
			padding: 0 8px;
			border: 1px solid #dbe3ec;
			border-radius: 7px;
			background: #ffffff;
			color: #475569;
			font-size: 14px;
			font-weight: 700;
			text-decoration: none;
			box-sizing: border-box;
		}

		.winner-page-link:hover {
			border-color: #0066e2;
			color: #0066e2;
		}

		.winner-page-link.is-active {
			border-color: #0066e2;
			background: #0066e2;
			color: #ffffff;
		}

		.winner-page-disabled {
			background: #f8fafc;
			color: #cbd5e1;
			cursor: default;
		}

		@media (max-width: 640px) {
			.user-event-page {
				padding: 45px 18px 70px;
			}

			.user-event-tabs {
				justify-content: flex-start;
				gap: 25px;
				overflow-x: auto;
			}

			.user-event-tabs a {
				padding: 16px 2px;
				font-size: 15px;
			}

			.user-event-tabs a.is-active::after {
				right: 2px;
				left: 2px;
			}

			.winner-search-form {
				align-items: stretch;
				flex-direction: column;
				padding: 18px;
			}

			.winner-search-input {
				width: 100%;
			}

			.winner-search-button,
			.winner-reset-button {
				width: 100%;
			}

			.winner-list-title {
				font-size: 23px;
			}
		}
	</style>

	<main class="user-event-page">

		<section class="user-event-title-area">
			<h1>이벤트</h1>
			<p>SkyRoute에서 준비한 다양한 이벤트를 확인해 보세요.</p>
		</section>

		<nav class="user-event-tabs" aria-label="이벤트 메뉴">
			<a th:href="@{/member/event/list}">
				이벤트 목록
			</a>

			<a th:href="@{/member/event/ended}">
				종료된 이벤트
			</a>

			<a th:href="@{/member/event/winner}"
			   class="is-active">
				당첨자 발표
			</a>
		</nav>

		<section>

			<h2 class="winner-list-title">당첨자 발표</h2>

			<form th:action="@{/member/event/winner}"
				  method="get"
				  class="winner-search-form">

				<input type="search"
					   name="keyword"
					   th:value="${winnerKeyword}"
					   class="winner-search-input"
					   placeholder="이벤트 제목을 입력하세요"
					   autocomplete="off">

				<button type="submit"
						class="winner-search-button">
					검색
				</button>

				<a th:href="@{/member/event/winner}"
				   class="winner-reset-button">
					초기화
				</a>

			</form>

			<div class="winner-result-head">

				<div class="winner-result-count">
					총
					<strong th:text="${winnerCount}">0</strong>건
				</div>

			</div>

			<div class="winner-table-wrap">

				<table class="winner-table">

					<thead>
						<tr>
							<th class="winner-image-column">
								배너
							</th>

							<th class="winner-date-column">
								발표일
							</th>

							<th>
								제목
							</th>

							<th class="winner-period-column">
								이벤트 기간
							</th>
						</tr>
					</thead>

					<tbody>

						<tr th:if="${eventList == null or eventList.isEmpty()}"
							class="winner-empty-row">

							<td colspan="4">
								<span class="material-symbols-outlined winner-empty-icon"
									  aria-hidden="true">
									emoji_events
								</span>

								<span th:if="${winnerKeyword == null or winnerKeyword == ''}">
									발표된 당첨 결과가 없습니다.
								</span>

								<span th:unless="${winnerKeyword == null or winnerKeyword == ''}">
									검색 결과가 없습니다.
								</span>
							</td>

						</tr>

						<tr th:each="event : ${eventList}">

							<td>

								<a th:href="@{/member/event/winner/detail(event_id=${event.event_id})}"
								   class="winner-thumbnail-link">

									<img th:if="${event.image_url != null
												and !#strings.isEmpty(event.image_url)}"
										 th:src="@{/assets/upload/{filename}(filename=${event.image_url})}"
										 th:alt="${event.title}">

									<span th:unless="${event.image_url != null
													and !#strings.isEmpty(event.image_url)}"
										  class="winner-thumbnail-empty">
										이미지 없음
									</span>

								</a>

							</td>

							<td class="winner-announced-date">

								<span th:if="${event.result_announced_at != null}"
									  th:text="${#dates.format(
									  			event.result_announced_at,
									  			'yyyy.MM.dd')}">
									2026.07.14
								</span>

								<span th:unless="${event.result_announced_at != null}">
									-
								</span>

							</td>

							<td class="winner-title-cell">

								<a th:href="@{/member/event/winner/detail(event_id=${event.event_id})}"
								   class="winner-title-link"
								   th:text="${event.title}">
									이벤트 제목
								</a>

							</td>

							<td class="winner-period">

								<span th:text="${#dates.format(
													event.start_date,
													'yyyy.MM.dd')}">
									2026.07.01
								</span>

								<br>

								<span>~</span>

								<span th:text="${#dates.format(
													event.end_date,
													'yyyy.MM.dd')}">
									2026.07.31
								</span>

							</td>

						</tr>

					</tbody>

				</table>

			</div>

			<nav th:if="${winnerPageCount > 1}"
				 class="winner-pagination"
				 aria-label="당첨자 발표 페이지">

				<a th:if="${winnerPageNum > 1}"
				   th:href="@{/member/event/winner(
				   				pageNum=1,
				   				keyword=${winnerKeyword})}"
				   class="winner-page-link">
					«
				</a>

				<span th:unless="${winnerPageNum > 1}"
					  class="winner-page-disabled">
					«
				</span>

				<a th:if="${winnerPageNum > 1}"
				   th:href="@{/member/event/winner(
				   				pageNum=${winnerPageNum - 1},
				   				keyword=${winnerKeyword})}"
				   class="winner-page-link">
					‹
				</a>

				<span th:unless="${winnerPageNum > 1}"
					  class="winner-page-disabled">
					‹
				</span>

				<a th:each="page : ${#numbers.sequence(
									winnerStartPage,
									winnerEndPage)}"
				   th:href="@{/member/event/winner(
				   				pageNum=${page},
				   				keyword=${winnerKeyword})}"
				   th:text="${page}"
				   th:classappend="${page == winnerPageNum}
				   					? ' is-active'"
				   class="winner-page-link">
					1
				</a>

				<a th:if="${winnerPageNum < winnerPageCount}"
				   th:href="@{/member/event/winner(
				   				pageNum=${winnerPageNum + 1},
				   				keyword=${winnerKeyword})}"
				   class="winner-page-link">
					›
				</a>

				<span th:unless="${winnerPageNum < winnerPageCount}"
					  class="winner-page-disabled">
					›
				</span>

				<a th:if="${winnerPageNum < winnerPageCount}"
				   th:href="@{/member/event/winner(
				   				pageNum=${winnerPageCount},
				   				keyword=${winnerKeyword})}"
				   class="winner-page-link">
					»
				</a>

				<span th:unless="${winnerPageNum < winnerPageCount}"
					  class="winner-page-disabled">
					»
				</span>

			</nav>

		</section>

	</main>

</th:block>

</body>
</html>
