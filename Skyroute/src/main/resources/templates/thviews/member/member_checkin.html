<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout_basic}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/assets/css/member.css}" type="text/css">	
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
<script type="text/javascript" th:src="@{/assets/js/yh.member.js}"></script>
</head>
<body>
<div layout:fragment="panel" class="panel on" id="checkin">
  <section class="block wrap">
    <div class="eyebrow">ONLINE CHECK-IN</div><h2 style="margin:6px 0 8px">온라인 체크인</h2>
    <p style="color:var(--mut);margin:0 0 22px; font-weight:300;">출발 48시간 전부터 1시간 전까지 체크인하고 모바일 탑승권을 받으세요.</p>
    <div class="bpass">
      <div class="bp-main">
        <div class="row1"><div class="nm">B O A R D I N G  P A S S</div><div class="brand" style="font-size:15px; color:#fff;"><div class="logo" style="width:26px;height:26px;font-size:11px">NU</div>에어누리</div></div>
        <div class="bproute">
          <div><div class="code">ICN</div><div class="city">서울 / 인천</div></div>
          <div class="mid">✈</div>
          <div style="text-align:right"><div class="code">JFK</div><div class="city">뉴욕</div></div>
        </div>
        <div class="bpgrid">
          <div class="c"><div class="l">Passenger</div><div class="v">HONG/GILDONG</div></div>
          <div class="c"><div class="l">Flight</div><div class="v">NU 101</div></div>
          <div class="c"><div class="l">Date</div><div class="v">20 DEC</div></div>
          <div class="c"><div class="l">Class</div><div class="v">Y</div></div>
          <div class="c"><div class="l">Gate</div><div class="v">A12</div></div>
          <div class="c"><div class="l">Boarding</div><div class="v">09:50</div></div>
          <div class="c"><div class="l">Seat</div><div class="v">23A</div></div>
          <div class="c"><div class="l">Group</div><div class="v">3</div></div>
        </div>
      </div>
      <div class="bp-stub">
        <div><div class="l">SEAT</div><div class="v">23A</div><div class="l" style="margin-top:12px">GATE</div><div class="v">A12</div></div>
        <div><div class="barcode"></div><div class="l" style="text-align:center;margin-top:8px">NUX4K9</div></div>
      </div>
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" style="border-radius: 12px;">탑승권 발급</button>
      <button class="btn ghost">모바일 지갑에 추가</button>
    </div>
  </section>
</div>
</body>
</html>
