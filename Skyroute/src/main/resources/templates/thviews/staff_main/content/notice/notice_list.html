<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 공지사항 관리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

<div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

<main class="main">

	<h1 id="contentPageTitle">공지사항 관리</h1>
	<p id="contentPageDesc" class="desc">
		사용자 페이지에 노출되는 공지사항을 등록, 수정, 공개/비공개 처리, 삭제합니다.
		비공개 공지는 사용자 공지사항 목록에 표시되지 않습니다.
	</p>

	<div id="noticeStats" class="grid notice-category-stats" style="margin-bottom:24px">
 
		<!-- 전체 공지 (히어로 카드) -->
		<a class="stat notice-category-stat notice-total-stat"
		   th:href="@{/staff/content/notice/list}"
		   th:classappend="${category == null} ? ' is-active' : ''">
	 
			<div class="ncs-top">
				<span class="ncs-icon material-symbols-outlined">article</span>
				<span class="ncs-label">전체 공지</span>
			</div>
	 
			<div class="ncs-value">
				<span th:text="${totalNoticeCount}">0</span><span class="ncs-unit">건</span>
			</div>
	 
			<div class="ncs-bar">
				<span class="ncs-bar-fill" style="width:100%"></span>
			</div>
	 
			<div class="ncs-code">ALL_NOTICE</div>
		</a>
	 
		<!-- 카테고리별 -->
		<a class="stat notice-category-stat"
		   th:each="stats : ${categoryStatsList}"
		   th:href="@{/staff/content/notice/list(category=${stats.category})}"
		   th:classappend="${category == stats.category} ? ' is-active' : ''">
	 
			<div class="ncs-top">
				<span class="ncs-icon material-symbols-outlined"
					  th:text="${stats.category == 'SKY_NEWS' ? 'newspaper'
							  : stats.category == 'FUEL_SURCHARGE' ? 'local_gas_station'
							  : stats.category == 'MEMBERSHIP_CLUB' ? 'card_membership'
							  : stats.category == 'PARTNER_NEWS' ? 'handshake'
							  : 'more_horiz'}">folder</span>
				<span class="ncs-label" th:text="${stats.categoryLabel}">스카이 소식</span>
			</div>
	 
			<div class="ncs-value">
				<span th:text="${stats.cnt}">0</span><span class="ncs-unit">건</span>
			</div>
	 
			<!-- 전체 대비 비율 바 (기존 데이터로 계산, 0건 나눗셈 방지) -->
			<div class="ncs-bar">
				<span class="ncs-bar-fill"
					  th:style="|width:${totalNoticeCount > 0 ? (stats.cnt * 100 / totalNoticeCount) : 0}%|"></span>
			</div>
	 
			<div class="ncs-code" th:text="${stats.category}">SKY_NEWS</div>
		</a>
	</div>

	<div id="eventStats" style="display:none;"></div>

	<div class="tabs">
		<button id="noticeTabButton"
				type="button"
				class="active"
				onclick="showNoticeTab(this)">
			공지사항 관리
		</button>

		<button id="eventTabButton"
				type="button"
				onclick="showEventTab(this)">
			이벤트 관리
		</button>

		<button type="button"
				onclick="location.href='/staff/content/faq/list'">
			FAQ 관리
		</button>
	</div>

	<div id="noticeTabContent">
	
			<!-- 등록 버튼 + NOTICE 배지 (카드 바깥 · 이벤트 탭과 동일) -->
			<div class="toolbar">
				<a th:href="@{/staff/content/notice/write}" class="btn btn-primary">
					<span class="material-symbols-outlined" style="font-size:18px">edit_document</span>
					공지사항 등록
				</a>
	
				<div class="grow"></div>
	
				<span class="badge badge-scheduled">NOTICE</span>
			</div>
	
			<!-- 검색 + 테이블 카드 -->
			<div class="card notice-card">
	
				<!-- 검색 폼 -->
			<form th:action="@{/staff/content/notice/list}" method="get" class="notice-filter">
 
				<!-- 검색 대상 -->
				<div class="filter-field">
					<label class="filter-label">검색 대상</label>
					<select name="keyfield" class="filter-select">
						<option value="1" th:selected="${keyfield == null or keyfield == '1'}">제목</option>
						<option value="2" th:selected="${keyfield == '2'}">등록자</option>
						<option value="3" th:selected="${keyfield == '3'}">본문</option>
					</select>
				</div>
			 
				<!-- 검색어 (아이콘 내장 · 남는 폭 흡수) -->
				<div class="filter-field filter-field-grow">
					<label class="filter-label">검색어</label>
					<div class="filter-search">
						<span class="material-symbols-outlined filter-search-icon">search</span>
						<input type="search"
							   name="keyword"
							   class="filter-input"
							   th:value="${keyword}"
							   placeholder="제목·등록자·본문으로 검색">
					</div>
				</div>
			 
				<!-- 카테고리 -->
				<div class="filter-field">
					<label class="filter-label">카테고리</label>
					<select name="category" class="filter-select">
						<option value="" th:selected="${category == null}">전체</option>
						<option th:each="cat : ${noticeCategoryMap}"
								th:value="${cat.key}"
								th:text="${cat.value}"
								th:selected="${category == cat.key}">스카이 소식</option>
					</select>
				</div>
			 
				<!-- 공개 상태 -->
				<div class="filter-field">
					<label class="filter-label">공개 상태</label>
					<select name="is_public" class="filter-select">
						<option value="" th:selected="${is_public == null}">전체</option>
						<option value="Y" th:selected="${is_public == 'Y'}">공개</option>
						<option value="N" th:selected="${is_public == 'N'}">비공개</option>
					</select>
				</div>
			 
				<!-- 액션 -->
				<div class="filter-actions">
					<button type="submit" class="btn btn-primary">
						<span class="material-symbols-outlined" style="font-size:18px">search</span>
						검색
					</button>
					<a th:href="@{/staff/content/notice/list}" class="btn btn-ghost">초기화</a>
				</div>
			</form>

			<!-- 목록 테이블 -->
			<div class="table-wrap">
				<table class="data notice-data">
					<thead>
						<tr>
							<th>공지 ID</th>
							<th>카테고리</th>
							<th>제목 / 본문 요약</th>
							<th>등록자</th>
							<th>공개 여부</th>
							<th>등록 일시</th>
							<th>수정 일시</th>
							<th>관리</th>
						</tr>
					</thead>

					<tbody>
						<tr th:if="${count == 0}">
							<td colspan="8" class="notice-empty-cell">
								조회된 공지사항이 없습니다.
							</td>
						</tr>

						<tr th:each="notice : ${list}">
							<td class="mono" th:text="${notice.notice_id}">1</td>

							<!-- 카테고리: VO 필드명이 다르면 ${notice.category} 부분만 교체 -->
							<td>
								<span class="badge badge-category"
								  th:attr="data-category=${notice.category}"
								  th:text="${notice.categoryLabel}">스카이 소식</span>
							</td>

							<td class="notice-title-cell">
								<a class="notice-row-title"
								   th:href="@{/staff/content/notice/detail(notice_id=${notice.notice_id})}"
								   th:text="${notice.title}">
									공지사항 제목
								</a>

								<div class="notice-row-summary"
									 th:text="${notice.content}">
									본문 요약
								</div>
							</td>

							<td th:text="${notice.memberVO != null ? notice.memberVO.name : '지상직'}">
								지상직
							</td>

							<!-- 공개 여부: 토글 스위치 (.notice-toggle : 기존 .toggle 과 분리) -->
							<td>
								<form th:action="@{/staff/content/notice/public}"
									  method="post"
									  class="notice-toggle-form">

									<input type="hidden"
										   th:if="${_csrf != null}"
										   th:name="${_csrf.parameterName}"
										   th:value="${_csrf.token}">

									<input type="hidden" name="notice_id" th:value="${notice.notice_id}">
									<input type="hidden" name="is_public" th:value="${notice.is_public == 'Y' ? 'N' : 'Y'}">

									<label class="notice-toggle">
										<input type="checkbox"
											   th:checked="${notice.is_public == 'Y'}"
											   onchange="if(confirm('공개 여부를 변경하시겠습니까?')){this.form.submit();}else{this.checked=!this.checked;}">
										<span class="notice-toggle-track"></span>
									</label>

									<span class="notice-toggle-label"
										  th:classappend="${notice.is_public == 'Y'} ? ' is-on' : ' is-off'"
										  th:text="${notice.is_public == 'Y' ? '공개' : '비공개'}">공개</span>
								</form>
							</td>

							<td class="notice-date" th:text="${notice.created_at}">2026-07-03 10:00</td>

							<td class="notice-date" th:text="${notice.updated_at != null ? notice.updated_at : '-'}">-</td>

							<!-- 관리: 상세 / 수정 / 삭제 (비공개 버튼 제거) -->
							<td>
								<div class="btn-action-group">
									<a class="btn btn-ghost btn-sm"
									   th:href="@{/staff/content/notice/detail(notice_id=${notice.notice_id})}">
										상세
									</a>

									<a class="btn btn-primary btn-sm"
									   th:href="@{/staff/content/notice/modify(notice_id=${notice.notice_id})}">
										수정
									</a>

									<form th:action="@{/staff/content/notice/delete}"
										  method="post"
										  style="display:inline;"
										  onsubmit="return confirm('삭제 시 복구할 수 없습니다. 삭제하시겠습니까?');">

										<input type="hidden"
											   th:if="${_csrf != null}"
											   th:name="${_csrf.parameterName}"
											   th:value="${_csrf.token}">

										<input type="hidden" name="notice_id" th:value="${notice.notice_id}">

										<button type="submit" class="btn btn-danger btn-sm">
											삭제
										</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="notice-paging" th:utext="${page}"></div>

		</div>
	</div>

	<div id="eventTabContent" style="display:none;"></div>
</main>

<script th:inline="javascript">
const eventFragmentUrl = /*[[@{/staff/content/event/fragment}]]*/ '/staff/content/event/fragment';

function setActiveTab(button) {
	document.querySelectorAll('.tabs button').forEach(tab => {
		tab.classList.remove('active');
	});

	button.classList.add('active');
}

function showNoticeTab(button) {
	document.getElementById('contentPageTitle').textContent = '공지사항 관리';
	document.getElementById('contentPageDesc').textContent =
		'사용자 페이지에 노출되는 공지사항을 등록, 수정, 공개/비공개 처리, 삭제합니다. 비공개 공지는 사용자 공지사항 목록에 표시되지 않습니다.';

	document.getElementById('noticeStats').style.display = 'grid';
	document.getElementById('eventStats').style.display = 'none';
	document.getElementById('noticeTabContent').style.display = 'block';
	document.getElementById('eventTabContent').style.display = 'none';

	setActiveTab(button);
}

function renderEventFragment(html) {
	const temp = document.createElement('div');
	temp.innerHTML = html;

	const statsFragment = temp.querySelector('#eventStatsFragment');
	const listFragment = temp.querySelector('#eventListFragment');

	const eventStats = document.getElementById('eventStats');
	const eventTabContent = document.getElementById('eventTabContent');

	if (!statsFragment || !listFragment) {
		throw new Error();
	}

	eventStats.innerHTML = statsFragment.outerHTML;
	eventTabContent.innerHTML = listFragment.outerHTML;
	eventTabContent.dataset.loaded = 'true';

	initEventSearch();
	initEventVisibilityToggle();
}

function loadEventFragment(params) {
	const requestParams = new URLSearchParams(params);

	if (!requestParams.get('pageNum')) {
		requestParams.set('pageNum', '1');
	}

	return fetch(eventFragmentUrl + '?' + requestParams.toString())
		.then(response => {
			if (!response.ok) {
				throw new Error();
			}

			return response.text();
		})
		.then(renderEventFragment)
		.catch(() => {
			document.getElementById('eventStats').innerHTML = '';
			document.getElementById('eventTabContent').innerHTML = `
				<div class="card" style="padding:28px; text-align:center;">
					이벤트 목록을 불러오지 못했습니다.
				</div>
			`;
		});
}

function initEventSearch() {
	const eventTabContent = document.getElementById('eventTabContent');
	const form = eventTabContent.querySelector('#eventSearchForm');

	if (!form) {
		return;
	}

	const statusInput = form.querySelector('#eventStatus');
	const filterButtons = form.querySelectorAll('.event-filter-btn');
	const resetButton = form.querySelector('#eventSearchReset');
	const pageButtons = eventTabContent.querySelectorAll('.event-page-btn');
	const statCards = document.getElementById('eventStats').querySelectorAll('.event-stat-card');

	form.addEventListener('submit', function(event) {
		event.preventDefault();

		const params = new URLSearchParams(new FormData(form));
		params.set('pageNum', '1');

		loadEventFragment(params);
	});

	filterButtons.forEach(button => {
		button.addEventListener('click', function() {
			statusInput.value = this.dataset.status;

			const params = new URLSearchParams(new FormData(form));
			params.set('pageNum', '1');

			loadEventFragment(params);
		});
	});

	resetButton.addEventListener('click', function() {
		form.querySelector('[name="keyword"]').value = '';
		statusInput.value = '';

		loadEventFragment(new URLSearchParams({
			pageNum: '1'
		}));
	});

	pageButtons.forEach(button => {
		button.addEventListener('click', function() {
			if (this.disabled) {
				return;
			}

			const params = new URLSearchParams(new FormData(form));
			params.set('pageNum', this.dataset.page);

			loadEventFragment(params);
		});
	});
	statCards.forEach(card => {
		card.addEventListener('click', function() {
			statusInput.value = this.dataset.eventStatus;

			const params = new URLSearchParams(new FormData(form));
			params.set('pageNum', '1');

			loadEventFragment(params);
		});
	});
}

function getCurrentEventParams() {
	const eventTabContent = document.getElementById('eventTabContent');
	const form = eventTabContent.querySelector('#eventSearchForm');
	const params = new URLSearchParams();

	if (form) {
		const formParams = new URLSearchParams(new FormData(form));

		formParams.forEach((value, key) => {
			params.set(key, value);
		});
	}

	const activePageButton = eventTabContent.querySelector('.event-page-btn.active');

	if (activePageButton) {
		params.set('pageNum', activePageButton.dataset.page);
	} else {
		params.set('pageNum', '1');
	}

	return params;
}

function initEventVisibilityToggle() {
	const eventTabContent = document.getElementById('eventTabContent');
	const forms = eventTabContent.querySelectorAll('.event-visibility-form');

	forms.forEach(form => {
		form.addEventListener('submit', function(event) {
			event.preventDefault();

			const scrollY = window.scrollY;
			const params = getCurrentEventParams();

			fetch(this.action, {
				method: 'POST',
				body: new FormData(this),
				headers: {
					'X-Requested-With': 'XMLHttpRequest'
				}
			})
				.then(response => {
					if (!response.ok) {
						throw new Error();
					}

					return loadEventFragment(params);
				})
				.then(() => {
					window.scrollTo(0, scrollY);
				})
				.catch(() => {
					alert('상태 변경 중 오류가 발생했습니다.');
				});
		});
	});
}

function showEventTab(button) {
	document.getElementById('contentPageTitle').textContent = '이벤트 배너 관리';
	document.getElementById('contentPageDesc').textContent =
		'메인 화면에 노출되는 이벤트 배너를 등록하고, 진행 상태와 참여자 현황 및 결과 발표를 관리합니다.';

	document.getElementById('noticeStats').style.display = 'none';
	document.getElementById('noticeTabContent').style.display = 'none';

	const eventStats = document.getElementById('eventStats');
	const eventTabContent = document.getElementById('eventTabContent');

	eventStats.style.display = 'block';
	eventTabContent.style.display = 'block';

	setActiveTab(button);

	if (eventTabContent.dataset.loaded === 'true') {
		return;
	}

	loadEventFragment(new URLSearchParams({
		pageNum: '1'
	}));
}

document.addEventListener('DOMContentLoaded', function() {
	const tab = new URLSearchParams(window.location.search).get('tab');

	if (tab === 'event') {
		showEventTab(document.getElementById('eventTabButton'));
	}
});
</script>
</body>
</html>
