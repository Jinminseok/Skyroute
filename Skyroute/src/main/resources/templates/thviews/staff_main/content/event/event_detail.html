<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 이벤트 상세</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

	<main class="main">

		<div class="toolbar">
			<div>
				<h1 style="margin-bottom:6px;">이벤트 상세</h1>
			</div>

			<div class="grow"></div>

			<a th:href="@{/staff/content/event}" class="btn btn-ghost">
				목록으로
			</a>

			<a th:href="@{/staff/content/event/update(event_id=${event.event_id})}"
			   class="btn btn-primary">
				수정
			</a>
		</div>

		<div class="card" style="margin-bottom:24px;">
			<div class="grid grid-2">

				<div>
					<img th:if="${event.image_url != null and !#strings.isEmpty(event.image_url)}"
						 th:src="@{/assets/upload/{file}(file=${event.image_url})}"
						 alt="이벤트 배너"
						 style="width:100%; max-height:340px; object-fit:cover; border-radius:10px;">

					<div th:unless="${event.image_url != null and !#strings.isEmpty(event.image_url)}"
						 style="height:220px; display:flex; align-items:center; justify-content:center; background:#F1F5F9; border-radius:10px; color:var(--text-light);">
						등록된 배너 이미지가 없습니다.
					</div>
				</div>

				<div>
					<div style="margin-bottom:20px;">
						<span class="badge"
							  th:classappend="${event.is_visible == 'Y'} ? 'badge-ok' : 'badge-muted'"
							  th:text="${event.is_visible == 'Y'} ? '노출 중' : '비노출'">
						</span>

						<span class="badge"
							  th:classappend="${event.is_ended == 'Y'} ? 'badge-muted' : 'badge-scheduled'"
							  th:text="${event.is_ended == 'Y'} ? '종료됨' : '진행 가능'">
						</span>
					</div>

					<h2 th:text="${event.title}" style="margin-bottom:20px;"></h2>

					<div class="form-grid">
						<div class="field">
							<label>진행 기간</label>
							<div class="input" style="display:flex; align-items:center;">
								<span th:text="${#dates.format(event.start_date, 'yyyy-MM-dd')}"></span>
								<span style="margin:0 8px;">~</span>
								<span th:text="${#dates.format(event.end_date, 'yyyy-MM-dd')}"></span>
							</div>
						</div>

						<div class="field">
							<label>메인 배너 노출 순서</label>
							<div class="input" th:text="${event.display_order}"></div>
						</div>

						<div class="field full">
							<label>상세 내용</label>
							<div class="input"
								 style="height:auto; min-height:160px; white-space:pre-wrap; line-height:1.7;"
								 th:text="${event.content}">
							</div>
						</div>
					</div>

					<div class="toolbar" style="margin-top:24px; margin-bottom:0;">
						<form th:if="${event.is_visible == 'Y'}"
							  th:action="@{/staff/content/event/hide}"
							  method="post">
							<input type="hidden" name="event_id" th:value="${event.event_id}">
							<button type="submit" class="btn btn-ghost">
								비노출 처리
							</button>
						</form>

						<form th:if="${event.is_ended == 'N'}"
							  th:action="@{/staff/content/event/end}"
							  method="post">
							<input type="hidden" name="event_id" th:value="${event.event_id}">
							<button type="submit" class="btn btn-danger">
								이벤트 종료
							</button>
						</form>
					</div>
				</div>

			</div>
		</div>

		<div class="toolbar">
			<div>
				<h2 style="margin:0;">이벤트 참여자</h2>
			</div>

			<div class="grow"></div>

			<span class="badge badge-scheduled">
				<span th:text="${#lists.size(participationList)}">0</span>명
			</span>
		</div>

		<div class="card">
			<div class="table-wrap">
				<table class="data">
					<thead>
						<tr>
							<th>참여 ID</th>
							<th>회원 ID</th>
							<th>이름</th>
							<th>로그인 ID</th>
							<th>이메일</th>
							<th>참여 일시</th>
						</tr>
					</thead>

					<tbody>
						<tr th:if="${#lists.isEmpty(participationList)}">
							<td colspan="6">이벤트 참여자가 없습니다.</td>
						</tr>

						<tr th:each="participation : ${participationList}">
							<td class="mono" th:text="${participation.participation_id}"></td>
							<td class="mono" th:text="${participation.member_id}"></td>
							<td th:text="${participation.name}"></td>
							<td class="mono" th:text="${participation.login_id}"></td>
							<td th:text="${participation.email}"></td>
							<td class="mono"
							    th:text="${#dates.format(participation.participated_at, 'yyyy-MM-dd HH:mm')}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</main>

</body>
</html>
