<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 이벤트 수정</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">

<style>
.event-edit-wrap {
	width: min(100%, 1040px);
	margin: 0 auto;
}

.event-edit-head {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 24px;
	margin-bottom: 24px;
}

.event-edit-head h1 {
	margin: 0 0 6px;
}

.event-edit-card {
	max-width: none;
}

.event-banner-box {
	padding: 14px;
	border: 1px solid var(--border);
	border-radius: 12px;
	background: #f8fbff;
}

.event-banner-image {
	display: block;
	width: 100%;
	max-width: 420px;
	height: 190px;
	object-fit: cover;
	border-radius: 8px;
}

.event-edit-actions {
	display: flex;
	justify-content: flex-end;
	gap: 10px;
	margin-top: 28px;
}

@media (max-width: 760px) {
	.event-edit-head {
		flex-direction: column;
	}

	.event-edit-head .btn {
		width: 100%;
		text-align: center;
	}

	.event-banner-image {
		height: 150px;
	}
}
</style>
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

	<main class="main">

		<div class="event-edit-wrap">

			<div class="event-edit-head">
				<div>
					<h1>이벤트 수정</h1>
					<p class="desc">이벤트 내용, 기간, 노출 여부, 배너 순서를 수정합니다.</p>
				</div>

				<a th:href="@{/staff/content/event/detail(event_id=${event.event_id})}"
				   class="btn btn-ghost">
					상세로
				</a>
			</div>

			<div class="card event-edit-card">
				<form th:action="@{/staff/content/event/update}"
				      th:object="${event}"
				      method="post"
				      enctype="multipart/form-data">

					<input type="hidden" th:field="*{event_id}">

					<div th:if="${error}"
					     style="margin-bottom:20px; padding:12px 14px; border-radius:8px; background:#FEF2F2; color:#DC2626; font-size:13px;"
					     th:text="${error}">
					</div>

					<div class="form-grid">

						<div class="field full">
							<label>이벤트명 *</label>
							<input type="text"
							       class="input"
							       th:field="*{title}">
						</div>

						<div class="field full">
							<label>이벤트 상세 내용 *</label>
							<textarea class="textarea"
							          th:field="*{content}"
							          rows="8"></textarea>
						</div>

						<div class="field">
							<label>시작일 *</label>
							<input type="date"
							       class="input"
							       th:field="*{start_date}">
						</div>

						<div class="field">
							<label>종료일 *</label>
							<input type="date"
							       class="input"
							       th:field="*{end_date}">
						</div>

						<div class="field">
							<label>메인 배너 노출 순서</label>
							<input type="number"
							       class="input"
							       min="0"
							       th:field="*{display_order}">
						</div>

						<div class="field">
							<label>사용자 화면 노출 여부</label>
							<select class="input" th:field="*{is_visible}">
								<option value="Y">노출</option>
								<option value="N">비노출</option>
							</select>
						</div>

						<div class="field full">
							<label>현재 배너 이미지</label>

							<div class="event-banner-box">
								<img th:if="${event.image_url != null and !#strings.isEmpty(event.image_url)}"
								     th:src="@{/assets/upload/{file}(file=${event.image_url})}"
								     alt="현재 이벤트 배너"
								     class="event-banner-image">

								<div th:unless="${event.image_url != null and !#strings.isEmpty(event.image_url)}"
								     style="height:190px; display:flex; align-items:center; justify-content:center; color:var(--text-light);">
									등록된 배너 이미지가 없습니다.
								</div>
							</div>
						</div>

						<div class="field full">
							<label>새 배너 이미지</label>
							<input type="file"
							       class="input"
							       name="upload"
							       accept="image/png,image/jpeg,image/gif,image/webp">

							<p style="margin-top:8px; color:var(--text-light); font-size:12px;">
								이미지를 선택하지 않으면 기존 배너 이미지를 유지합니다.
							</p>
						</div>

					</div>

					<div class="event-edit-actions">
						<a th:href="@{/staff/content/event/detail(event_id=${event.event_id})}"
						   class="btn btn-ghost">
							취소
						</a>

						<button type="submit" class="btn btn-primary">
							수정 저장
						</button>
					</div>

				</form>
			</div>

		</div>

	</main>

</body>
</html>
