<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 공지사항 상세</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

<div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

<main class="main">

	<h1>공지사항 상세</h1>
	<p class="desc">등록된 공지사항의 상세 내용과 공개 여부를 확인합니다.</p>

	<div class="card notice-detail-card">

		<div class="toolbar">
			<span class="badge badge-scheduled"
				  th:text="${notice.categoryLabel}">
				일반
			</span>
			<span th:if="${notice.is_public == 'Y'}" class="badge badge-ok">공개</span>
			<span th:if="${notice.is_public == 'N'}" class="badge badge-muted">비공개</span>

			<div class="grow"></div>

			<a th:href="@{/staff/content/notice/list}" class="btn btn-ghost">목록</a>
			<a th:href="@{/staff/content/notice/modify(notice_id=${notice.notice_id})}" class="btn btn-primary">수정</a>
		</div>

		<h1 th:text="${notice.title}">공지사항 제목</h1>

		<div class="notice-detail-meta">
			<span>공지 ID : <b class="mono" th:text="${notice.notice_id}">1</b></span>
			<span>카테고리 : <b th:text="${notice.categoryLabel}">일반</b></span>
			<span>등록자 : <b th:text="${notice.memberVO != null ? notice.memberVO.name : '지상직'}">지상직</b></span>
			<span>등록일 : <b th:text="${notice.created_at}">2026-07-03 10:00</b></span>
			<span th:if="${notice.updated_at != null}">수정일 : <b th:text="${notice.updated_at}">2026-07-03 10:00</b></span>
		</div>

		<div class="notice-detail-content" th:utext="${notice.content}">
			공지사항 본문
		</div>

		<div class="toolbar" style="margin-top:20px;">
			<form th:action="@{/staff/content/notice/public}"
				  method="post"
				  onsubmit="return confirm('공개 여부를 변경하시겠습니까?');">

				<input type="hidden"
					   th:if="${_csrf != null}"
					   th:name="${_csrf.parameterName}"
					   th:value="${_csrf.token}">

				<input type="hidden" name="notice_id" th:value="${notice.notice_id}">
				<input type="hidden" name="is_public" th:value="${notice.is_public == 'Y' ? 'N' : 'Y'}">

				<button type="submit"
						class="btn btn-ghost"
						th:text="${notice.is_public == 'Y' ? '비공개 처리' : '공개 처리'}">
					비공개 처리
				</button>
			</form>

			<div class="grow"></div>

			<form th:action="@{/staff/content/notice/delete}"
				  method="post"
				  onsubmit="return confirm('삭제 시 복구할 수 없습니다. 삭제하시겠습니까?');">

				<input type="hidden"
					   th:if="${_csrf != null}"
					   th:name="${_csrf.parameterName}"
					   th:value="${_csrf.token}">

				<input type="hidden" name="notice_id" th:value="${notice.notice_id}">

				<button type="submit" class="btn btn-danger">
					삭제
				</button>
			</form>
		</div>

	</div>

</main>

</body>
</html>
