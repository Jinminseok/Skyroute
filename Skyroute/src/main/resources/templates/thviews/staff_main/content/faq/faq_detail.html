<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어 - FAQ 상세 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">
<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>
<body>
    <div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

    <main class="main">
        <div style="max-width: 900px; margin: 0 auto;">
            <div class="toolbar" style="margin-bottom: 16px;">
                <a th:href="@{/staff/content/faq/list}" class="btn btn-ghost">
                    <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span> 목록으로
                </a>
                <div class="grow"></div>
                <a th:href="@{/staff/content/faq/modify(faq_id=${faq.faq_id})}" class="btn btn-primary">수정</a>
            </div>

            <div class="card notice-detail-card">
                <h1 th:text="${faq.question}">질문 내용이 여기에 표시됩니다.</h1>
                
                <div class="notice-detail-meta">
                    <span>카테고리: <b th:text="${faq.category}"></b></span>
                    <span>상태: <b th:text="${faq.is_visible == 'Y' ? '공개' : '비공개'}" th:style="${faq.is_visible == 'Y' ? 'color:var(--ok)' : 'color:var(--danger)'}"></b></span>
                    <span>등록 일시: <b th:text="${faq.created_at}"></b></span>
                </div>

                <div class="notice-detail-content" style="white-space: pre-wrap;" th:text="${faq.answer}">
                    답변 내용이 여기에 표시됩니다.
                </div>
            </div>
        </div>
    </main>
</body>
</html>
