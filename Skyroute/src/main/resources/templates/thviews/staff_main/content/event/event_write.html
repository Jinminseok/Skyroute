<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 이벤트 등록</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

	<main class="main">

		<div class="toolbar">
			<div>
				<h1 style="margin-bottom:6px;">새 이벤트 등록</h1>
				<p class="desc">사용자 메인 화면에 노출할 이벤트 배너와 상세 내용을 등록합니다.</p>
			</div>

			<div class="grow"></div>

			<a th:href="@{/staff/content/event}" class="btn btn-ghost">
				목록으로
			</a>
		</div>

		<div class="card" style="max-width:900px;">
			<form th:action="@{/staff/content/event/write}"
			      th:object="${event}"
			      method="post"
			      enctype="multipart/form-data">

				<div th:if="${error}"
				     style="margin-bottom:20px; padding:12px 14px; border-radius:8px; background:#FEF2F2; color:#DC2626; font-size:13px;"
				     th:text="${error}">
				</div>

				<div class="form-grid">

					<div class="field full">
						<label>이벤트명 *</label>
						<input type="text"
						       class="input"
						       th:field="*{title}"
						       placeholder="예: 제주 노선 얼리버드 특가">
					</div>

					<div class="field full">
						<label>이벤트 상세 내용 *</label>
						<textarea class="textarea"
						          th:field="*{content}"
						          rows="8"
						          placeholder="이벤트 참여 방법, 대상, 혜택, 유의사항을 입력하세요."></textarea>
					</div>

					<div class="field">
						<label>시작일 *</label>
						<input type="date"
						       class="input"
						       th:field="*{start_date}">
					</div>

					<div class="field">
						<label>종료일 *</label>
						<input type="date"
						       class="input"
						       th:field="*{end_date}">
					</div>

					<div class="field">
						<label>메인 배너 노출 순서</label>
						<input type="number"
						       class="input"
						       min="0"
						       th:field="*{display_order}">
					</div>

					<div class="field">
						<label>사용자 화면 노출 여부</label>
						<select class="input" th:field="*{is_visible}">
							<option value="Y">노출</option>
							<option value="N">비노출</option>
						</select>
					</div>

					<div class="field full">
						<label>배너 이미지 *</label>
						<input type="file"
						       class="input"
						       name="upload"
						       accept="image/png,image/jpeg,image/gif,image/webp">
						<p style="margin-top:8px; color:var(--text-light); font-size:12px;">
							PNG, JPG, GIF, WEBP 이미지 파일만 등록할 수 있으며 최대 10MB까지 업로드할 수 있습니다.
						</p>
					</div>

				</div>

				<div class="toolbar" style="margin-top:28px; margin-bottom:0;">
					<div class="grow"></div>

					<a th:href="@{/staff/content/event}" class="btn btn-ghost">
						취소
					</a>

					<button type="submit" class="btn btn-primary">
						이벤트 등록
					</button>
				</div>

			</form>
		</div>

	</main>

</body>
</html>
