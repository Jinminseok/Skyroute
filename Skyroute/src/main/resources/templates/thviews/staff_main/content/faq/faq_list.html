<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />
<title>에어 - 자주 묻는 질문(FAQ) 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">
<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>
<body>
    <div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

    <main class="main">
        <h1>자주 묻는 질문(FAQ) 관리</h1>
        <p class="desc">고객지원(FAQ) 페이지에 노출되는 질문과 답변을 등록, 수정, 공개/비공개 처리합니다.</p>

        <!-- FAQ 현황 통계 박스 -->
        <div class="grid grid-3" style="margin-bottom:24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
            <div class="stat">
                <div class="label">
                    <span class="material-symbols-outlined" style="font-size:18px; color:var(--primary)">quiz</span>
                    전체 FAQ
                </div>
                <div class="value" style="color:var(--primary)">
                    <span th:text="${totalCnt != null ? totalCnt : 0}">0</span><span class="unit">건</span>
                </div>
            </div>
            <div class="stat">
                <div class="label">
                    <span class="material-symbols-outlined" style="font-size:18px; color:var(--ok)">visibility</span>
                    공개 중
                </div>
                <div class="value" style="color:var(--ok)">
                    <span th:text="${publicCnt != null ? publicCnt : 0}">0</span><span class="unit">건</span>
                </div>
            </div>
            <div class="stat">
                <div class="label">
                    <span class="material-symbols-outlined" style="font-size:18px; color:var(--mut)">visibility_off</span>
                    비공개
                </div>
                <div class="value" style="color:var(--mut)">
                    <span th:text="${privateCnt != null ? privateCnt : 0}">0</span><span class="unit">건</span>
                </div>
            </div>
        </div>
        <!-- 통계 박스 끝 -->

        <div class="tabs">
            <button type="button" onclick="location.href='/staff/content/notice/list'">공지사항 관리</button>
            <button type="button" onclick="location.href='/staff/content/notice/list?tab=event'">이벤트 관리</button>
            <button type="button" class="active">FAQ 관리</button>
        </div>

        <div class="toolbar">
            <div style="display: flex; gap: 8px;">
            	<!-- FAQ 등록 -->
                <a th:href="@{/staff/content/faq/write}" class="btn btn-primary">
                    <span class="material-symbols-outlined" style="font-size:18px">add_circle</span> 새 FAQ 등록
                </a>
                
                <!-- 우선순위 설정 버튼 -->
                <a th:href="@{/staff/content/faq/priority}" class="btn btn-ghost" style="border: 1px solid var(--line);">
                    <span class="material-symbols-outlined" style="font-size:18px">format_list_numbered</span> 최상단 우선순위 설정
                </a>
            </div>
            
            <div class="grow"></div>
            <span class="badge badge-scheduled">FAQ</span>
        </div>

        <div class="card notice-card">
            <form action="/staff/content/faq/list" method="get" class="notice-search-form form-grid" style="grid-template-columns: 200px 1fr auto auto;">
                <div class="field">
                    <select name="category" class="select">
                        <option value="">카테고리 선택 (전체)</option>
			            <option value="예약/항공권" th:selected="${category == '예약/항공권'}">예약/항공권</option>
			            <option value="결제/환불/취소" th:selected="${category == '결제/환불/취소'}">결제/환불/취소</option>
			            <option value="수하물" th:selected="${category == '수하물'}">수하물</option>
			            <option value="탑승/수속" th:selected="${category == '탑승/수속'}">탑승/수속</option>
			            <option value="기타" th:selected="${category == '기타'}">기타</option>
                    </select>
                </div>
                <div class="field">
                    <input type="text" name="keyword" class="input" placeholder="질문 또는 답변 내용으로 검색" th:value="${keyword}">
                </div>
                <div class="field" style="justify-content: flex-end;">
                    <button type="submit" class="btn btn-primary" style="height:42px;">
                        <span class="material-symbols-outlined" style="font-size:18px">search</span> 검색
                    </button>
                </div>
                <div class="field" style="justify-content: flex-end;">
                    <a th:href="@{/staff/content/faq/list}" class="btn btn-ghost" style="height:42px;">초기화</a>
                </div>
                <div></div>
            </form>

            <div class="table-wrap">
                <table class="data notice-data">
                    <thead>
                        <tr>
                            <th style="width: 80px;">FAQ ID</th>
                            <th style="width: 120px;">카테고리</th>
                            <th>질문 (Question)</th>
                            <th style="width: 140px;">공개 여부</th>
                            <th style="width: 160px;">등록 일시</th>
                            <th style="width: 160px;">관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="faq : ${list}">
                            <td th:text="${faq.faq_id}">1</td>
                            <td><span class="badge badge-category" th:text="${faq.category}">수하물</span></td>
                            <td class="notice-title-cell">
                                <a th:href="@{/staff/content/faq/detail(faq_id=${faq.faq_id})}" class="notice-row-title" th:text="${faq.question}"></a>
                            </td>
                            <td>
                                <label class="notice-toggle-form">
                                    <div class="notice-toggle">
                                        <input type="checkbox" th:checked="${faq.is_visible == 'Y'}" th:onchange="toggleFaqVisible([[${faq.faq_id}]], this)">
                                        <div class="notice-toggle-track"></div>
                                    </div>
                                    <span class="notice-toggle-label" th:classappend="${faq.is_visible == 'Y' ? 'is-on' : 'is-off'}" th:text="${faq.is_visible == 'Y' ? '공개' : '비공개'}"></span>
                                </label>
                            </td>
                            <td class="notice-date" th:text="${#strings.arraySplit(faq.created_at, ' ')[0]}">2026-07-10</td>
                            <td>
                                <div class="btn-action-group">
                                    <a th:href="@{/staff/content/faq/modify(faq_id=${faq.faq_id})}" class="btn btn-primary btn-sm">수정</a>
                                    <button type="button" class="btn btn-danger btn-sm" th:onclick="deleteFaq([[${faq.faq_id}]])">삭제</button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${count == 0}">
                            <td colspan="6" class="notice-empty-cell">등록된 FAQ가 없거나 검색 결과가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="notice-paging" th:if="${count > 0}">
                <a th:if="${currentPage > 1}" th:href="@{/staff/content/faq/list(pageNum=${currentPage - 1}, category=${category}, keyword=${keyword})}">이전</a>
                <span style="display:inline-block; padding:0 15px; font-weight:bold; color:var(--primary);" th:text="|${currentPage} / ${totalPage}|"></span>
                <a th:if="${currentPage < totalPage}" th:href="@{/staff/content/faq/list(pageNum=${currentPage + 1}, category=${category}, keyword=${keyword})}">다음</a>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
    // FAQ 상태 토글 로직
    function toggleFaqVisible(faqId, checkbox) {
        const isVisible = checkbox.checked ? 'Y' : 'N';
        const label = checkbox.closest('.notice-toggle-form').querySelector('.notice-toggle-label');
        
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch('/staff/content/faq/toggle', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest',
                [csrfHeader]: csrfToken 
            },
            body: JSON.stringify({ faq_id: faqId, is_visible: isVisible })
        })
        .then(res => res.text())
        .then(result => {
            if(result === 'success') {
                /* label.textContent = isVisible === 'Y' ? '공개' : '비공개';
                label.className = 'notice-toggle-label ' + (isVisible === 'Y' ? 'is-on' : 'is-off'); */
                location.reload();
            } else {
                alert('상태 변경에 실패했습니다.');
                checkbox.checked = !checkbox.checked;
            }
        })
        .catch(err => {
            console.error(err);
            alert('서버 통신 오류가 발생했습니다.');
            checkbox.checked = !checkbox.checked;
        });
    }

    // FAQ 삭제
    function deleteFaq(faqId) {
        if(!confirm('이 FAQ를 정말 삭제하시겠습니까?\n(삭제 후에는 복구할 수 없습니다.)')) return;

        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');

        // 가상의 폼 생성
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/staff/content/faq/delete';

        // 삭제할 FAQ 번호를 폼에 담기
        const idInput = document.createElement('input');
        idInput.type = 'hidden';
        idInput.name = 'faq_id';
        idInput.value = faqId;
        
        // 폼 전송에서 인식하는 기본 이름표(_csrf) 달아주기
        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = '_csrf'; 
        csrfInput.value = csrfToken;

        // 폼에 데이터들을 넣고 서버로 전송
        form.appendChild(idInput);
        form.appendChild(csrfInput);
        document.body.appendChild(form);
        form.submit();
    }
    </script>
</body>
</html>
