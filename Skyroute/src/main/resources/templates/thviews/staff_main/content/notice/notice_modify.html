<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 공지사항 수정</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

<div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

<main class="main">

	<h1>공지사항 수정</h1>
	<p class="desc">공지사항 제목, 본문, 공개 여부를 수정합니다.</p>

	<div class="card">

		<form th:action="@{/staff/content/notice/modify}"
			  th:object="${staffNoticeVO}"
			  method="post">

			<input type="hidden"
				   th:if="${_csrf != null}"
				   th:name="${_csrf.parameterName}"
				   th:value="${_csrf.token}">

			<input type="hidden" th:field="*{notice_id}">

			<div class="form-grid">

				<div class="field full">
					<label for="title">제목</label>
					<input type="text"
						   th:field="*{title}"
						   id="title"
						   class="input"
						   maxlength="200">

					<div class="field-error"
						 th:if="${#fields.hasErrors('title')}"
						 th:errors="*{title}">
						제목 오류
					</div>
				</div>

				<div class="field">
					<label for="category">카테고리</label>
					<select th:field="*{category}" id="category" class="select">
						<option value="">카테고리 선택</option>
						<option th:each="cat : ${noticeCategoryMap}"
								th:value="${cat.key}"
								th:text="${cat.value}">
							일반
						</option>
					</select>
				
					<div class="field-error"
						 th:if="${#fields.hasErrors('category')}"
						 th:errors="*{category}">
						카테고리 오류
					</div>
				</div>

				<div class="field">
					<label for="is_public">공개 여부</label>
					<select th:field="*{is_public}" id="is_public" class="select">
						<option value="Y">공개</option>
						<option value="N">비공개</option>
					</select>

					<div class="field-error"
						 th:if="${#fields.hasErrors('is_public')}"
						 th:errors="*{is_public}">
						공개 여부 오류
					</div>
				</div>

				<div class="field full">
					<label for="content">본문</label>
					<textarea th:field="*{content}"
							  id="content"
							  class="textarea notice-textarea"></textarea>

					<div class="field-error"
						 th:if="${#fields.hasErrors('content')}"
						 th:errors="*{content}">
						본문 오류
					</div>
				</div>

			</div>

			<div class="toolbar" style="margin-top:20px;">
				<div class="grow"></div>

				<a th:href="@{/staff/content/notice/detail(notice_id=*{notice_id})}" class="btn btn-ghost">취소</a>

				<button type="submit" class="btn btn-primary">
					<span class="material-symbols-outlined" style="font-size:18px">save</span>
					수정
				</button>
			</div>

		</form>

	</div>

</main>

</body>
</html>
