<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어 - FAQ 수정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">
<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>
<body>
    <div th:replace="~{fragments/staff_header :: staffHeader('content')}"></div>

    <main class="main">
        <div style="max-width: 900px; margin: 0 auto;">
            <h1>FAQ 수정</h1>
            <p class="desc">등록된 FAQ의 내용을 수정합니다.</p>

            <div class="card notice-card">
                <form th:action="@{/staff/content/faq/modify}" method="post">
                    <input type="hidden" name="faq_id" th:value="${faq.faq_id}">
                    
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                        
                        <div class="field">
                            <label>카테고리 분류 *</label>
                            <select name="category" class="select" required>
                                <option value="예약/항공권" th:selected="${faq.category == '예약/항공권'}">예약/항공권</option>
                                <option value="결제/환불" th:selected="${faq.category == '결제/환불'}">결제/환불</option>
                                <option value="수하물" th:selected="${faq.category == '수하물'}">수하물</option>
                                <option value="탑승/수속" th:selected="${faq.category == '탑승/수속'}">탑승/수속</option>
                                <option value="기타" th:selected="${faq.category == '기타'}">기타</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>공개 여부 *</label>
                            <select name="is_visible" class="select" required>
                                <option value="Y" th:selected="${faq.is_visible == 'Y'}">공개 (사용자 페이지에 노출)</option>
                                <option value="N" th:selected="${faq.is_visible == 'N'}">비공개</option>
                            </select>
                        </div>

                        <div class="field full">
                            <label>질문 (Question) *</label>
                            <input type="text" name="question" class="input" th:value="${faq.question}" required>
                        </div>

                        <div class="field full">
                            <label>답변 (Answer) *</label>
                            <textarea name="answer" class="textarea notice-textarea" th:text="${faq.answer}" required></textarea>
                        </div>

                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                        <a th:href="@{/staff/content/faq/detail(faq_id=${faq.faq_id})}" class="btn btn-ghost">취소</a>
                        <button type="submit" class="btn btn-primary">수정 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
