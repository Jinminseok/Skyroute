<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 지연·결항 안내 관리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('delay')}"></div>

	<main class="main">

		<h1>지연 · 결항 안내 관리</h1>
		<p class="desc">
			특정 항공편에 지연 또는 결항이 발생한 경우 사유를 등록합니다.
			등록 시 항공편 운항 상태가 DELAYED 또는 CANCELLED로 변경되며,
			추후 SSE 알림과 자동 환불 로직을 연결합니다.
		</p>

		<div class="grid" style="grid-template-columns:420px minmax(0, 1fr); align-items:start;">

			<!-- 지연/결항 신규 등록 폼 -->
			<div class="card">

				<h3 style="margin-bottom:16px; font-size:15px; font-weight:700; color:var(--text-dark);">
					지연/결항 신규 안내 등록
				</h3>

				<div class="field" style="margin-bottom:14px;">
					<label style="font-weight:600; font-size:12px; display:block; margin-bottom:4px;">
						대상 항공편 선택
					</label>

					<select class="select" id="noticeFlightId">
						<option value="1">HJ-1207 (서울김포 → 제주공항)</option>
						<option value="2">HJ-8821 (인천공항 → 도쿄나리타)</option>
						<option value="3">HJ-3340 (김해공항 → 제주공항)</option>
						<option value="4">HJ-5012 (서울김포 → 김해공항)</option>
					</select>
				</div>

				<div class="field" style="margin-bottom:14px;">
					<label style="font-weight:600; font-size:12px; display:block; margin-bottom:4px;">
						안내 유형
					</label>

					<select class="select"
					        id="noticeType"
					        onchange="toggleNoticeField()">
						<option value="DELAY">지연 (DELAY)</option>
						<option value="CANCEL">결항 (CANCEL)</option>
					</select>
				</div>

				<div class="field"
				     style="margin-bottom:14px;"
				     id="noticeDelayWrapper">
					<label style="font-weight:600; font-size:12px; display:block; margin-bottom:4px;">
						예상 지연 시간
					</label>

					<input class="input"
					       type="number"
					       id="noticeDelayMinutes"
					       min="1"
					       placeholder="예: 40">

					<p style="font-size:12px; color:var(--text-light); margin-top:6px;">
						지연 안내 등록 시 1분 이상의 지연 시간을 입력해야 합니다.
					</p>
				</div>

				<div class="field" style="margin-bottom:20px;">
					<label style="font-weight:600; font-size:12px; display:block; margin-bottom:4px;">
						상세 발생 사유
					</label>

					<textarea class="textarea"
					          id="noticeReason"
					          rows="5"
					          placeholder="예: 인천공항 기상 악화 및 연결편 지연으로 인한 스케줄 변동"></textarea>
				</div>

				<button type="button"
				        class="btn btn-primary"
				        style="width:100%;"
				        onclick="submitFlightNotice()">
					<span class="material-symbols-outlined" style="font-size:18px">campaign</span>
					등록 및 실시간 알림 발송
				</button>

			</div>

			<!-- 안내 등록 이력 -->
			<div class="card">

				<div class="toolbar" style="margin-bottom:16px;">
					<h3 style="font-size:15px; font-weight:700; color:var(--text-dark); margin:0;">
						안내 정보 등록 이력
					</h3>

					<div class="grow"></div>

					<span class="badge badge-scheduled">
						FLIGHT_NOTICE
					</span>
				</div>

				<div class="table-wrap">
					<table class="data">
						<thead>
							<tr>
								<th>안내 ID</th>
								<th>항공편</th>
								<th>안내 유형</th>
								<th>예상 지연 시간</th>
								<th>상세 발생 사유</th>
								<th>등록자 ID</th>
								<th>등록 일시</th>
							</tr>
						</thead>

						<tbody id="noticeHistoryTable">
							<!-- staff.js에서 하드코딩 데이터 바인딩 -->
						</tbody>
					</table>
				</div>

			</div>

		</div>

	</main>

	<div class="toast-wrap" id="toasts"></div>

	<script th:src="@{/assets/js/staff.js}"></script>

</body>
</html>
