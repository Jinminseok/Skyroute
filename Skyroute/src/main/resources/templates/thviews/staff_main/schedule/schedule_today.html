<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 오늘 항공편</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('today')}"></div>

	<main class="main">

		<h1>오늘 항공편 실시간 상태 관리</h1>
		<p class="desc">
			금일 운항되는 항공편 스케줄의 상태를 수동 변경하여 단계별 전이를 수행합니다.
		</p>

		<div class="grid grid-4" style="margin-bottom:24px">

			<div class="stat">
				<div class="label">
					<span class="material-symbols-outlined" style="font-size:18px">
						flight_takeoff
					</span>
					총 운항 예정
				</div>
				<div class="value">
					4<span class="unit">편</span>
				</div>
			</div>

			<div class="stat">
				<div class="label">
					<span class="material-symbols-outlined" style="font-size:18px; color:var(--ok)">
						check_circle
					</span>
					정상/예정 상태
				</div>
				<div class="value" style="color:var(--ok)">
					3<span class="unit">편</span>
				</div>
			</div>

			<div class="stat">
				<div class="label">
					<span class="material-symbols-outlined" style="font-size:18px; color:var(--warn)">
						schedule
					</span>
					지연 상태
				</div>
				<div class="value" style="color:var(--warn)">
					0<span class="unit">편</span>
				</div>
			</div>

			<div class="stat">
				<div class="label">
					<span class="material-symbols-outlined" style="font-size:18px; color:var(--danger)">
						cancel
					</span>
					결항 상태
				</div>
				<div class="value" style="color:var(--danger)">
					1<span class="unit">편</span>
				</div>
			</div>

		</div>

		<div class="board">

			<div class="board-head">
				<div class="t">
					<span class="material-symbols-outlined" style="color:var(--primary)">
						display_settings
					</span>
					실시간 운항 현황판 제어
				</div>
				<div class="clk" id="clock">--:--:--</div>
			</div>

			<div class="board-row head">
				<span>항공편명</span>
				<span>노선구간</span>
				<span>출발시각</span>
				<span>출발게이트</span>
				<span>항공기모델</span>
				<span>현재 상태</span>
				<span>수동 상태 변경 제어</span>
			</div>

			<div id="todayBoardRows">
				<!-- staff.js에서 하드코딩 데이터 바인딩 -->
			</div>

		</div>

	</main>

	<div class="toast-wrap" id="toasts"></div>

	<script th:src="@{/assets/js/staff.js}"></script>

</body>
</html>
