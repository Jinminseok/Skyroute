<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 운항 스케줄 관리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('schedule')}"></div>

	<main class="main">

		<h1>운항 스케줄 등록 및 조회</h1>
		<p class="desc">
			기초 운영 데이터를 기반으로 신규 항공편을 추가하거나 스케줄 내역을 관리합니다.
			운항 스케줄 취소는 물리 삭제가 아닌 soft delete 방식으로 처리합니다.
		</p>

		<div class="toolbar">
			<input class="input"
			       id="searchFlightNo"
			       placeholder="항공편 번호 검색 예: HJ-1207"
			       style="width:260px; flex-grow:0;">

			<div class="grow"></div>

			<button type="button"
			        class="btn btn-primary"
			        onclick="openFlightAddModal()">
				<span class="material-symbols-outlined" style="font-size:18px">add</span>
				새 운항 스케줄 등록
			</button>
		</div>

		<div class="card">
			<div class="table-wrap">
				<table class="data">
					<thead>
						<tr>
							<th>항공편번호</th>
							<th>노선 ID</th>
							<th>항공기 ID</th>
							<th>출발게이트</th>
							<th>도착게이트</th>
							<th>출발시각 → 도착시각</th>
							<th>운항상태</th>
							<th>지연</th>
							<th>스케줄 관리</th>
						</tr>
					</thead>

					<tbody id="flightScheduleTable">
						<!-- staff.js에서 하드코딩 데이터 바인딩 -->
					</tbody>
				</table>
			</div>
		</div>

	</main>

	<!-- 통합 동적 제어 편집 모달 -->
	<div class="modal-overlay" id="globalModal">
		<div class="modal">

			<div class="modal-head">
				<div>
					<h3 id="globalModalTitle">운항 스케줄 등록/수정</h3>
				</div>

				<button type="button"
				        class="modal-close"
				        onclick="closeModal()">
					<span class="material-symbols-outlined">close</span>
				</button>
			</div>

			<div class="modal-body" id="globalModalBody">
				<!-- staff.js에서 등록/수정 폼 동적 생성 -->
			</div>

			<div class="modal-foot">
				<button type="button"
				        class="btn btn-ghost"
				        onclick="closeModal()">
					취소
				</button>

				<button type="button"
				        class="btn btn-primary"
				        id="globalModalSubmitBtn"
				        onclick="saveGlobalModalData()">
					데이터 저장
				</button>
			</div>

		</div>
	</div>

	<div class="toast-wrap" id="toasts"></div>

	<script th:src="@{/assets/js/staff.js}"></script>

</body>
</html>
