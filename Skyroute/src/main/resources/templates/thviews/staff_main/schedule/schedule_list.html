<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<title>에어 - 운항 스케줄 관리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('schedule')}"></div>

	<main class="main">

		<h1>운항 스케줄 등록 및 조회</h1>
		<p class="desc">
			기초 운영 데이터를 기반으로 신규 항공편을 추가하거나 스케줄 내역을 관리합니다.
			운항 스케줄 취소는 물리 삭제가 아닌 soft delete 방식으로 처리합니다.
		</p>

		<div class="toolbar">
			<input class="input"
			       id="searchFlightNo"
			       placeholder="항공편 번호 검색 예: HJ-1207"
			       style="width:260px; flex-grow:0;">

			<div class="grow"></div>

			<button type="button"
			        class="btn btn-primary"
			        onclick="openFlightAddModal()">
				<span class="material-symbols-outlined" style="font-size:18px">add</span>
				새 운항 스케줄 등록
			</button>
		</div>

		<div class="card">
			<div class="table-wrap">
				<table class="data">
					<thead>
						<tr>
							<th>항공편번호</th>
							<th>노선 ID</th>
							<th>항공기 ID</th>
							<th>출발게이트</th>
							<th>도착게이트</th>
							<th>출발시각 → 도착시각</th>
							<th>운항상태</th>
							<th>지연</th>
							<th>스케줄 관리</th>
						</tr>
					</thead>

					<tbody id="flightScheduleTable">
					    <tr th:each="f : ${scheduleList}">
					        <td style="font-weight:bold; color:var(--primary);" class="mono" th:text="${f.flight_no}"></td>
					        <td style="font-size:13px;" th:text="${f.route_name}"></td>
					        <td style="font-size:13px;" th:text="${f.aircraft_name}"></td>
					        <td class="mono" th:text="${f.dep_gate_code != null ? f.dep_gate_code : '미정'}"></td>
					        <td class="mono" th:text="${f.arr_gate_code != null ? f.arr_gate_code : '미정'}"></td>
					        <td style="font-size:13px;" class="mono">
					            <span th:text="${#strings.replace(f.departure_time, 'T', ' ')}"></span> <br> 
					            <span style="color:#94a3b8;" th:text="'➔ ' + ${#strings.replace(f.arrival_time, 'T', ' ')}"></span>
					        </td>
					        
					        <td>
					            <span th:if="${f.flight_status == 'SCHEDULED'}" class="badge badge-scheduled">운항예정</span>
					            <span th:if="${f.flight_status == 'BOARDING'}" class="badge badge-boarding">탑승중</span>
					            <span th:if="${f.flight_status == 'DEPARTED'}" class="badge badge-departed">출발완료</span>
					            <span th:if="${f.flight_status == 'ARRIVED'}" class="badge badge-arrived">도착완료</span>
					            <span th:if="${f.flight_status == 'DELAYED'}" class="badge badge-delayed">지연</span>
					            <span th:if="${f.flight_status == 'CANCELLED' or f.flight_status == 'CANCELED'}" class="badge badge-cancelled">결항</span>
					            <span th:if="${f.flight_status == 'COMPLETED'}" class="badge badge-completed">운항종료</span>
					        </td>
					        
					        <td th:style="${f.delay_minutes > 0 ? 'color:var(--danger); font-weight:bold;' : ''}" class="mono" th:text="${f.delay_minutes > 0 ? f.delay_minutes + '분' : '-'}"></td>
					        <td>
					            <div class="btn-action-group">
					                <button type="button" class="btn btn-ghost btn-sm" 
					                    th:data-id="${f.flight_id}" th:data-no="${f.flight_no}" th:data-route="${f.route_id}" 
					                    th:data-ac="${f.aircraft_id}" th:data-dgate="${f.departure_gate_id}" th:data-agate="${f.arrival_gate_id}" 
					                    th:data-dtime="${f.departure_time}" th:data-atime="${f.arrival_time}"
					                    onclick="openFlightEditModal(this)">
					                    <span class="material-symbols-outlined" style="font-size:14px">edit</span> 수정
					                </button>
					                <button type="button" class="btn btn-danger btn-sm" th:onclick="deleteFlight([[${f.flight_id}]])">
					                    스케줄 취소
					                </button>
					            </div>
					        </td>
					    </tr>
					    <tr th:if="${#lists.isEmpty(scheduleList)}">
					        <td colspan="9" style="text-align:center; padding:40px; color:#94a3b8;">등록된 운항 스케줄이 없습니다.</td>
					    </tr>
					</tbody>
				</table>
			</div>
		</div>

	</main>

	<!-- 운항 스케쥴 등록 -->
	<div class="modal-overlay" id="flightModal" style="display: none;">
		<div class="modal">
			<div class="modal-head">
				<div>
					<h3 id="flightModalTitle">운항 스케줄 등록</h3>
				</div>
				<button type="button" class="modal-close" onclick="closeFlightModal()">
					<span class="material-symbols-outlined">close</span>
				</button>
			</div>

			<div class="modal-body">
				<form id="flightForm">
					<input type="hidden" id="modalFlightId" name="flight_id">

					<div class="form-grid">
						<div class="field full">
							<label>항공편 번호 (Flight No) *</label> 
							<input type="text" id="modalFlightNo" name="flight_no" class="input" placeholder="예: HJ-1207" required>
						</div>

						<div class="field full">
							<label>운항 노선 *</label> 
							<select id="modalRouteId" name="route_id" class="select" required>
								<option value="">노선을 선택하세요</option>
								<option th:each="route : ${routeList}" th:value="${route.route_id}" th:text="|${route.dep_airport_name} → ${route.arr_airport_name} (${route.type_name})|"></option>
							</select>
						</div>

						<div class="field full">
							<label>투입 항공기 *</label> 
							<select id="modalAircraftId" name="aircraft_id" class="select" required>
								<option value="">항공기를 선택하세요</option>
								<option th:each="ac : ${aircraftList}" th:value="${ac.aircraft_id}" th:text="|${ac.reg_no} (${ac.model_name}) - ${ac.status_name}|"></option>
							</select>
						</div>

						<div class="field">
							<label>출발 게이트</label> 
							<select id="modalDepGateId" name="departure_gate_id" class="select">
								<option value="0">미정</option>
								<option th:each="gate : ${gateList}" th:value="${gate.gateId}" th:text="|${gate.airportName} - ${gate.gateCode}|"></option>
							</select>
						</div>

						<div class="field">
							<label>도착 게이트</label> 
							<select id="modalArrGateId" name="arrival_gate_id" class="select">
								<option value="0">미정</option>
								<option th:each="gate : ${gateList}" th:value="${gate.gateId}" th:text="|${gate.airportName} - ${gate.gateCode}|"></option>
							</select>
						</div>

						<div class="field">
							<label>출발 시각 *</label> 
							<input type="datetime-local" id="modalDepTime" name="departure_time" class="input" required>
						</div>

						<div class="field">
							<label>도착 시각 *</label> 
							<input type="datetime-local" id="modalArrTime" name="arrival_time" class="input" required>
						</div>
					</div>
				</form>
			</div>

			<div class="modal-foot">
				<button type="button" class="btn btn-ghost" onclick="closeFlightModal()">취소</button>
				<button type="button" class="btn btn-primary" onclick="saveFlightData()">데이터 저장</button>
			</div>
		</div>
	</div>

	<div class="toast-wrap" id="toasts"></div>

	<script th:src="@{/assets/js/staff.js}"></script>

</body>
</html>
