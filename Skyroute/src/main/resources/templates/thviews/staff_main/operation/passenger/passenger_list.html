<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>

<title>에어 - 탑승 관리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('operation')}"></div>

	<main class="main">
		<h1>항공편별 예약 승객 체크인 · 탑승 상태 처리</h1>
		<p class="desc">결제가 완료되고 예약이 확정된 탑승객 명단을 기준으로 체크인, 탑승 확정, 미탑승 처리를 수행합니다.</p>

		<div class="toolbar">
			<select class="select" style="width: 320px;" id="paxFlightSelector"
				onchange="loadPaxData()">
				<option value="">항공편 스케줄 불러오는 중...</option>
			</select>

			<div class="grow"></div>
			<span class="badge badge-scheduled"
				style="font-size: 13px; padding: 6px 14px;" id="paxSummaryLabel">
				집계 조회 중... </span>
		</div>

		<div class="card">
			<div class="table-wrap">
				<table class="data">
					<thead>
						<tr>
							<th>예약번호</th>
							<th>승객명</th>
							<th>지정좌석</th>
							<th>예약상태</th>
							<th>결제상태</th>
							<th>체크인/탑승 상태</th>
							<th>체크인 처리자</th>
							<th>현장 수속 처리</th>
						</tr>
					</thead>
					<tbody id="paxListTable">
						<tr>
							<td colspan="8"
								style="text-align: center; color: #94A3B8; padding: 40px 0;">
								데이터를 불러오는 중입니다...</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<div class="toast-wrap" id="toasts"></div>

	<script>
    function getHeaders() {
        const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
        const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");
        return { 'Content-Type': 'application/json', [header]: token };
    }

    function loadFlightList() {
        fetch('/staff/operation/api/flights', { headers: getHeaders() })
            .then(res => res.json())
            .then(res => {
                const selector = document.getElementById('paxFlightSelector');
                selector.innerHTML = '';
                if(res.result === 'success' && res.data.length > 0) {
                    res.data.forEach(flight => {
                        const option = document.createElement('option');
                        option.value = flight.flightId;
                        option.text = `${flight.flightNo} · ${flight.depAirport} → ${flight.arrAirport} [${flight.departureTime}]`;
                        selector.appendChild(option);
                    });
                    loadPaxData();
                } else {
                    selector.innerHTML = '<option value="">등록된 운항 스케줄이 없습니다.</option>';
                    document.getElementById('paxSummaryLabel').innerText = `수속 확정자: 총 0명`;
                }
            });
    }

    function loadPaxData() {
        const flightId = document.getElementById('paxFlightSelector').value;
        if (!flightId) return;

        fetch(`/staff/operation/api/passengers?flightId=${flightId}&t=${new Date().getTime()}`, {
            headers: getHeaders()
        })
        .then(res => res.json())
        .then(res => {
            if(res.result === 'success') {
                renderTable(res.data);
                const selectBox = document.getElementById('paxFlightSelector');
                const flightText = selectBox.options[selectBox.selectedIndex].text.split(' ·')[0];
                document.getElementById('paxSummaryLabel').innerText = `${flightText} 수속 확정자: 총 ${res.data.length}명`;
            }
        });
    }

    function renderTable(list) {
        const tbody = document.getElementById('paxListTable');
        tbody.innerHTML = '';
        
        // 추가된 방어 로직: 데이터가 없을 경우 처리
        if (!list || list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #94A3B8; padding: 40px 0;">조회된 확정 승객이 없습니다.</td></tr>`;
            return;
        }

        list.forEach(pax => {
            let holdKor = pax.holdStatus === 'CONFIRMED' ? '예약확정' : pax.holdStatus;
            let payKor = pax.paymentStatus === 'PAID' ? '결제완료' : '결제대기';
            
            let statusBadge = '';
            if (pax.checkinStatus === 'NOT_CHECKED_IN') statusBadge = '<span class="badge badge-waiting">체크인 대기</span>';
            else if (pax.checkinStatus === 'CHECKED_IN') statusBadge = '<span class="badge badge-checkedin">체크인 완료</span>';
            else if (pax.checkinStatus === 'BOARDED') statusBadge = '<span class="badge badge-boarded">탑승 완료</span>';
            else if (pax.checkinStatus === 'NO_SHOW') statusBadge = '<span class="badge badge-noshow">노쇼 처리</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${pax.pnrCode || '-'}</td>
                <td><b>${pax.passengerName || '-'}</b></td>
                <td>${pax.seatName || '-'}</td>
                <td><span class="badge badge-info">${holdKor}</span></td>
                <td><span class="badge badge-ok">${payKor}</span></td>
                <td>${statusBadge}</td>
                <td>${pax.checkedInByName || '-'}</td>
                <td>
                    <div class="btn-action-group">
                        <button type="button" class="btn" onclick="changeStatus(${pax.ticketId}, 'CHECKED_IN')">체크인 완료</button>
                        <button type="button" class="btn btn-primary" onclick="changeStatus(${pax.ticketId}, 'BOARDED')">탑승 확정</button>
                        <button type="button" class="btn btn-danger" onclick="changeStatus(${pax.ticketId}, 'NO_SHOW')">노쇼 처리</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function changeStatus(ticketId, newStatus) {
        if(!confirm('해당 승객의 상태를 변경하시겠습니까?')) return;
        fetch('/staff/operation/api/updateStatus', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ ticketId: ticketId, checkinStatus: newStatus })
        })
        .then(res => res.json())
        .then(res => {
            if(res.result === 'success') {
                alert('처리가 완료되었습니다.');
                loadPaxData();
            } else {
                alert('처리 실패: ' + res.message);
            }
        });
    }

    document.addEventListener("DOMContentLoaded", loadFlightList);
	</script>

</body>
</html>
