<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>에어 - 탑승 관리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

<link rel="stylesheet" th:href="@{/assets/css/staff.css}">
</head>

<body>

	<div th:replace="~{fragments/staff_header :: staffHeader('operation')}"></div>

	<main class="main">

		<h1>항공편별 예약 승객 체크인 · 탑승 상태 처리</h1>
		<p class="desc">
			결제가 완료되고 예약이 확정된 탑승객 명단을 기준으로 체크인, 탑승 확정, 미탑승 처리를 수행합니다.
		</p>

		<div class="toolbar">

			<select class="select"
			        style="width:320px;"
			        id="paxFlightSelector"
			        onchange="loadPaxData()">
				<option value="HJ-1207">HJ-1207 · 서울김포 → 제주공항 [08:20]</option>
				<option value="HJ-8821">HJ-8821 · 인천공항 → 도쿄나리타 [10:15]</option>
			</select>

			<div class="grow"></div>

			<span class="badge badge-scheduled"
			      style="font-size:13px; padding:6px 14px;"
			      id="paxSummaryLabel">
				체크인 대상자 집계 조회 중...
			</span>

		</div>

		<div class="card">

			<div class="table-wrap">

				<table class="data">
					<thead>
						<tr>
							<th>예약번호</th>
							<th>승객명</th>
							<th>지정좌석</th>
							<th>예약상태</th>
							<th>결제상태</th>
							<th>체크인/탑승 상태</th>
							<th>체크인 처리자</th>
							<th>현장 수속 처리</th>
						</tr>
					</thead>

					<tbody id="paxListTable">
						<!-- staff.js에서 하드코딩 데이터 바인딩 -->
					</tbody>
				</table>

			</div>

		</div>

	</main>

	<div class="toast-wrap" id="toasts"></div>

	<script th:src="@{/assets/js/staff.js}"></script>

</body>
</html>
