<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어누리 - 총괄 관리자 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />

<link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>

 <header th:replace="~{fragments/admin_header :: headerFragment('statistics')}"></header>
<main class="main">
    <div>
      <h1>전사 통합 운영 통계 대시보드</h1>
      <p class="desc">매출·예약·환불·탑승객·운영현황 지표를 기간 조건으로 조회하고 차트로 시각화합니다.</p>

      <div style="display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 20px;">
        <button class="tab-btn active" onclick="switchTab('revenue', this)" style="padding: 10px 20px; background: none; border: none; font-size: 14px; font-weight: 700; color: var(--primary); border-bottom: 2px solid var(--primary); cursor: pointer;">매출 통계</button>
        <button class="tab-btn" onclick="switchTab('booking', this)" style="padding: 10px 20px; background: none; border: none; font-size: 14px; font-weight: 500; color: var(--text-gray); border-bottom: 2px solid transparent; cursor: pointer;">예약 통계</button>
      </div>

      <div id="tab-revenue" class="sub-page" style="display: block;">
        
        <div class="card" style="margin-bottom: 20px;">
          <div class="toolbar" style="display: flex; align-items: center; gap: 12px; padding: 8px 4px;">
            <label style="font-size: 14px; font-weight: 600; color: var(--text-gray); margin: 0;">조회기간</label>
            
            <input type="date" id="startDate" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; color: #333; outline: none; cursor: pointer;">
            
            <span style="color: var(--text-light); font-weight: 600;">~</span>
            
            <input type="date" id="endDate" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; color: #333; outline: none; cursor: pointer;">
            
            <button class="btn btn-primary btn-sm" onclick="fetchStatistics()" style="padding: 8px 18px; margin-left: 4px; font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer;">조회</button>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card" style="display:flex; flex-direction:column; justify-content:center; align-items:center; padding:40px;">
            <span class="material-symbols-outlined" style="font-size:36px; color:var(--text-light); margin-bottom:12px;">payments</span>
            
            <h3 id="totalRevenueTxt" style="font-size:24px; font-weight:700;">0 원</h3>
            <p style="color:var(--text-gray); font-size:13px;">조회기간 누적 매출</p>
          </div>
          
          <div class="card">
            <h3 style="font-size:16px; font-weight:700; margin-bottom:16px;">노선별 매출 비중</h3>
            <div class="table-wrap">
              <table class="data">
                <thead><tr><th>노선</th><th>매출액</th></tr></thead>
               
                <tbody id="routeRevenueBody">
                  <tr><td colspan="2" style="text-align: center; color: var(--text-gray);">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-booking" class="sub-page" style="display: none;">
        <div class="grid grid-2">
           <div class="card" style="display:flex; flex-direction:column; justify-content:center; align-items:center; padding:40px;">
            <span class="material-symbols-outlined" style="font-size:36px; color:var(--text-light); margin-bottom:12px;">receipt_long</span>
            <!-- [수정] 하드코딩된 건수 삭제 및 id 부여 -->
            <h3 id="totalBookingsTxt" style="font-size:24px; font-weight:700;">0 건</h3>
            <p style="color:var(--text-gray); font-size:13px;">조회기간 전체 예약 건수</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // [추가] 화면이 로드되면 자동으로 통계 데이터 1회 조회
    document.addEventListener('DOMContentLoaded', function() {
      fetchStatistics();
    });

    // 데이터 조회 함수
    function fetchStatistics() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      fetch(`/admin/statistics/data?startDate=${startDate}&endDate=${endDate}`)
        .then(response => response.json())
        .then(data => {
          // 1. 매출 데이터 업데이트 (정확한 id 선택)
          document.getElementById('totalRevenueTxt').innerText = 
            (data.totalRevenue || 0).toLocaleString() + ' 원';

          // 2. 예약 데이터 업데이트 (정확한 id 선택)
          document.getElementById('totalBookingsTxt').innerText = 
            (data.totalBookings || 0).toLocaleString() + ' 건';

          // 3. 노선별 매출 테이블 업데이트
          const tbody = document.getElementById('routeRevenueBody');
          tbody.innerHTML = ''; // 기존 데이터 초기화

          if (data.routeRevenues && data.routeRevenues.length > 0) {
            data.routeRevenues.forEach(item => {
              const row = `<tr>
                <td>${item.routeName}</td>
                <td style="font-weight:600;">${(item.routeRevenue || 0).toLocaleString()} 원</td>
              </tr>`;
              tbody.innerHTML += row;
            });
          } else {
            // 조회된 데이터가 없을 경우
            tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: var(--text-gray);">조회된 데이터가 없습니다.</td></tr>';
          }
        })
        .catch(error => console.error('통계 데이터 로딩 오류:', error));
    }

    // 내부 탭 전환 스크립트
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.style.color = 'var(--text-gray)';
        btn.style.fontWeight = '500';
        btn.style.borderBottomColor = 'transparent';
      });
      el.style.color = 'var(--primary)';
      el.style.fontWeight = '700';
      el.style.borderBottomColor = 'var(--primary)';

      document.querySelectorAll('.sub-page').forEach(page => page.style.display = 'none');
      document.getElementById('tab-' + tabId).style.display = 'block';
    }
  </script>
</body>
</html>
