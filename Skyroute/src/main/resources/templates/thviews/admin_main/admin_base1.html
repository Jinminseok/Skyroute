<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어누리 - 총괄 관리자 메인</title>

<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />

<link rel="stylesheet" th:href="@{/assets/css/admin.css}">

</head>
<body>

	<header th:replace="~{fragments/admin_header :: headerFragment('base1')}"></header>

	<main class="main">
		<div>
			<h1>공항 권역, 게이트 및 노선 기준 정보</h1>
			<p class="desc">지상직(STAFF)이 노선 및 게이트를 등록할 때 참조하는 대분류 마스터 데이터를 관리합니다.</p>

			<div class="grid grid-2" style="margin-bottom: 24px;">

				<div class="card">
					<div class="toolbar">
						<h3 style="font-size: 16px; font-weight: 700;">공항 권역 (REGION)</h3>
						<div class="grow"></div>
						<button type="button" class="btn btn-ghost btn-sm" onclick="openModal()">전체 조회 및 관리</button>
					</div>
					<div class="table-wrap">
						<table class="data">
							<thead>
								<tr>
									<th>권역 ID</th>
									<th>권역명</th>
									<th>사용 여부</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="region, stat : ${regionList}" th:if="${stat.index < 3}">
									<td th:text="${region.regionId}"></td>
									<td th:text="${region.regionName}"></td>
									<td>
										<div class="toggle"
											th:classappend="${region.isActive == 'Y'} ? 'on' : ''"
											th:attr="onclick=|toggleActiveStatus(this, ${region.regionId}, '${region.isActive}')|">
										</div>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(regionList)}">
									<td colspan="3" style="text-align: center; padding: 20px;">등록된 권역이 없습니다.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>

				<div class="card">
					<div class="toolbar">
						<h3 style="font-size: 16px; font-weight: 700;">게이트 구역 (GATE_AREA)</h3>
					</div>
					<div class="table-wrap">
						<table class="data">
							<tr>
								<td style="text-align: center; padding: 20px;">추후 작업 예정</td>
							</tr>
						</table>
					</div>
				</div>

			</div>
		</div>
	</main>

	<div id="regionModal" class="modal-overlay">
		<div class="modal-content-large">
			<div class="modal-header">
				<h2 class="modal-title">권역 데이터 전체 관리</h2>
				<button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()">닫기 ✕</button>
			</div>

			<form th:action="@{/admin/region/insert}" method="post" style="display: flex; gap: 10px; margin-bottom: 20px;">
				<input type="text" name="regionName" class="form-input" placeholder="새로운 권역명 입력" required style="margin-bottom: 0;">
				<button type="submit" class="btn btn-primary" style="white-space: nowrap;">등록 추가</button>
			</form>

			<div class="table-wrap scrollable-wrap">
				<table class="data">
					<thead>
						<tr>
							<th>ID</th>
							<th>권역명</th>
							<th>상태</th>
							<th>관리</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="region : ${regionList}">
							<td th:text="${region.regionId}"></td>
							<td th:text="${region.regionName}"></td>
							<td th:id="'modal-status-' + ${region.regionId}" th:text="${region.isActive == 'Y' ? '사용 (Y)' : '미사용 (N)'}"></td>
							<td style="display: flex; gap: 5px;">
								<button type="button" class="btn btn-ghost btn-sm"
									th:id="'modal-edit-btn-' + ${region.regionId}"
									th:data-name="${region.regionName}"
									th:attr="onclick=|openEditModal('${region.regionId}', this.getAttribute('data-name'), '${region.isActive}')|">
									수정</button>

								<button type="button" class="btn btn-ghost btn-sm"
									style="color: #ef4444; border-color: #fca5a5;"
									th:attr="onclick=|if(confirm('정말 삭제하시겠습니까?')) location.href='/admin/region/delete?regionId=${region.regionId}'|">
									삭제</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<div id="editRegionModal" class="modal-overlay">
		<div class="modal-content-small">
			<div class="modal-header">
				<h2 class="modal-title">권역명 수정</h2>
				<button type="button" class="close-btn" onclick="closeEditModal()">✕</button>
			</div>
			<form th:action="@{/admin/region/update}" method="post">
				<input type="hidden" id="editRegionId" name="regionId">
				<label for="editRegionName" class="input-label">권역명</label>
				<input type="text" id="editRegionName" name="regionName" class="form-input" required>
				<label for="editIsActive" class="input-label">사용 여부</label>
				<select id="editIsActive" name="isActive" class="form-input">
					<option value="Y">사용 (Y)</option>
					<option value="N">미사용 (N)</option>
				</select>
				<div class="modal-footer">
					<button type="button" class="btn btn-ghost" onclick="closeEditModal()">취소</button>
					<button type="submit" class="btn btn-primary">저장</button>
				</div>
			</form>
		</div>
	</div>

	<script>
		// 1. 모달 제어 함수
		function openModal() { document.getElementById('regionModal').style.display = 'flex'; }
		function closeModal() { document.getElementById('regionModal').style.display = 'none'; }
		function openEditModal(id, name, isActive) {
			document.getElementById('editRegionId').value = id;
			document.getElementById('editRegionName').value = name;
			document.getElementById('editIsActive').value = isActive;
			document.getElementById('editRegionModal').style.display = 'flex';
		}
		function closeEditModal() { document.getElementById('editRegionModal').style.display = 'none'; }

		// 2. 비동기 상태 변경 함수
	    function toggleActiveStatus(element, regionId, currentStatus) {
	        const newStatus = (currentStatus === 'Y') ? 'N' : 'Y';
	        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
	        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
	        const formData = new URLSearchParams();
	        
	        formData.append("regionId", regionId);
	        formData.append("isActive", newStatus);

	        fetch('/admin/region/toggleStatus', {
	            method: 'POST',
	            headers: {
	                'Content-Type': 'application/x-www-form-urlencoded',
	                [csrfHeader]: csrfToken
	            },
	            body: formData
	        })
	        .then(response => {
	            if (!response.ok) throw new Error("네트워크 응답 오류");
	            return response.text();
	        })
	        .then(result => {
	            if (result === "success") {
	                if (newStatus === 'Y') {
	                    element.classList.add('on');
	                } else {
	                    element.classList.remove('on');
	                }
	                element.setAttribute("onclick", `toggleActiveStatus(this, ${regionId}, '${newStatus}')`);

	                const modalStatusTd = document.getElementById('modal-status-' + regionId);
	                if (modalStatusTd) modalStatusTd.innerText = (newStatus === 'Y') ? '사용 (Y)' : '미사용 (N)';

	                const modalEditBtn = document.getElementById('modal-edit-btn-' + regionId);
	                if (modalEditBtn) {
	                    const regionName = modalEditBtn.getAttribute('data-name');
	                    modalEditBtn.setAttribute('onclick', `openEditModal('${regionId}', '${regionName}', '${newStatus}')`);
	                }
	            } else {
	                alert("상태 변경 처리에 실패했습니다. (서버 내부 오류)");
	            }
	        })
	        .catch(error => {
	            console.error('Error:', error);
	            alert("통신 중 오류가 발생했습니다.");
	        });
	    }
	</script>

</body>
</html>
