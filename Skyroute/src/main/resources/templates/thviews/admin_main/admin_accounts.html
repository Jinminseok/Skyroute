<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어누리 - 총괄 관리자 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />

<link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>

 <header th:replace="~{fragments/admin_header :: headerFragment('accounts')}"></header>

  <main class="main">
    <div>
      <h1>시스템 계정 및 가입 회원 관리</h1>
      <p class="desc">가입 회원(USER)의 상태를 통제하고 지상직(STAFF) 업무 계정을 직접 생성 및 배포합니다.</p>
      
      <div style="display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 20px;">
        <button class="tab-btn active" onclick="switchTab('user', this)" style="padding: 10px 20px; background: none; border: none; font-size: 14px; font-weight: 700; color: var(--primary); border-bottom: 2px solid var(--primary); cursor: pointer;">가입 회원 (USER) 관리</button>
        <button class="tab-btn" onclick="switchTab('staff', this)" style="padding: 10px 20px; background: none; border: none; font-size: 14px; font-weight: 500; color: var(--text-gray); border-bottom: 2px solid transparent; cursor: pointer;">지상직 계정 (STAFF) 발급</button>
      </div>

      <div id="tab-user" class="sub-page" style="display: block;">
        <div class="card">
          <div class="toolbar">
            <h3 style="font-size:16px; font-weight:700;">가입 회원 목록</h3>
            <div class="grow"></div>
            <div style="padding:8px 14px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; background:#fff;">
              <span class="material-symbols-outlined" style="font-size:18px; color:var(--text-gray);">search</span>
              <input type="text" placeholder="아이디, 이름 검색" style="border:none; outline:none; margin-left:8px;">
            </div>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>회원 ID</th><th>이름</th><th>이메일</th><th>회원 상태</th><th>관리</th></tr></thead>
              <tbody>
                <tr>
                  <td>10021</td>
                  <td>홍길동</td>
                  <td>hong@example.com</td>
                  <td><span style="color:#0D9488; background:rgba(13,148,136,0.1); padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:600;">정상 (ACTIVE)</span></td>
                  <td><button class="btn btn-ghost btn-sm">상세</button> <button class="btn btn-ghost btn-sm" style="color:var(--danger)">정지</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="tab-staff" class="sub-page" style="display: none;">
        <div class="card">
          <div class="toolbar">
            <h3 style="font-size:16px; font-weight:700;">사내 지상직 계정 목록</h3>
            <div class="grow"></div>
            <button class="btn btn-primary"><span class="material-symbols-outlined" style="font-size:18px; margin-right:4px;">person_add</span> 지상직 계정 생성</button>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>사번</th><th>성명</th><th>연락처</th><th>상태</th><th>관리</th></tr></thead>
              <tbody>
                <tr>
                  <td>STF_001</td>
                  <td>박지상 매니저</td>
                  <td>010-1111-2222</td>
                  <td><span style="color:#0D9488; font-weight:600;">활성</span></td>
                  <td><button class="btn btn-ghost btn-sm">수정</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // 내부 탭 전환 스크립트
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.style.color = 'var(--text-gray)';
        btn.style.fontWeight = '500';
        btn.style.borderBottomColor = 'transparent';
      });
      el.style.color = 'var(--primary)';
      el.style.fontWeight = '700';
      el.style.borderBottomColor = 'var(--primary)';

      document.querySelectorAll('.sub-page').forEach(page => page.style.display = 'none');
      document.getElementById('tab-' + tabId).style.display = 'block';
    }
  </script>
</body>
</html>
