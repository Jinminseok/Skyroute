<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어누리 - 총괄 관리자 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />

<link rel="stylesheet" th:href="@{/assets/css/admin.css}">

</head>
<body>

 <header th:replace="~{fragments/admin_header :: headerFragment('base2')}"></header>

  <main class="main">
    <div>
      <h1>기재 운영 상태, 좌석 등급 및 운임 시즌 관리</h1>
      <p class="desc">항공기 배정 제한 여부, 기재별 좌석 자동 생성 규칙 및 운임 시즌 기준 데이터를 통제합니다.</p>
      
      <div class="card" style="margin-bottom: 24px;">
        <div class="toolbar">
          <h3 style="font-size:16px; font-weight:700;">항공기 운영 상태 (AIRCRAFT_STATUS)</h3>
          <div class="grow"></div>
          <button class="btn btn-primary btn-sm">상태 등록</button>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr><th>운영상태 ID</th><th>상태명</th><th>사용 여부</th><th>비고</th><th>관리</th></tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td><span style="color:#0D9488; font-weight:600; background:rgba(13,148,136,0.1); padding:4px 10px; border-radius:99px; font-size:11.5px;">운항가능 (ACTIVE)</span></td>
                <td><div class="toggle on" onclick="this.classList.toggle('on')"></div></td>
                <td>배정 가능</td>
                <td><button class="btn btn-ghost btn-sm">수정</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="grid grid-2">
        
        <div class="card">
          <div class="toolbar">
            <h3 style="font-size:16px; font-weight:700;">좌석 등급 구성 (SEAT_CLASS)</h3>
            <div class="grow"></div>
            <button class="btn btn-primary btn-sm">좌석 등급 생성</button>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>등급명</th><th>배열 형태</th><th>사용 여부</th><th>관리</th></tr></thead>
              <tbody>
                <tr>
                  <td>비즈니스 (Business)</td>
                  <td>행당 6열</td>
                  <td><div class="toggle on" onclick="this.classList.toggle('on')"></div></td>
                  <td><button class="btn btn-ghost btn-sm">수정</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="toolbar">
            <h3 style="font-size:16px; font-weight:700;">운임 시즌 (SEASON)</h3>
            <div class="grow"></div>
            <button class="btn btn-primary btn-sm">시즌 등록</button>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>시즌명</th><th>기간</th><th>사용 여부</th><th>관리</th></tr></thead>
              <tbody>
                <tr>
                  <td>2026 하계 성수기</td>
                  <td>2026-07-20 ~ 08-15</td>
                  <td><div class="toggle on" onclick="this.classList.toggle('on')"></div></td>
                  <td><button class="btn btn-ghost btn-sm">수정</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
