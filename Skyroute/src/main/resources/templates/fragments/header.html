<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<th:block th:fragment="header">

	<header class="sr-header">

		<!-- ================= 상단 유틸리티 바 ================= -->
		<div class="sr-topbar">
			<div class="sr-wrap sr-topbar-inner">

				<div class="sr-topbar-left">
					<a th:href="@{/member/member_functions}">기능 한눈에 보기</a>
					<span class="sr-topbar-divider" aria-hidden="true"></span>
					<a th:href="@{/member/member_route}">운항 노선</a>
				</div>

				<div class="sr-topbar-right">

					<a th:href="@{/member/notice/list}" class="sr-topbar-link">
						<span class="material-symbols-outlined" aria-hidden="true">campaign</span>
						공지사항
					</a>

					<!-- 고객센터 드롭다운 -->
					<div class="sr-topbar-dropdown">
						<button type="button" class="sr-topbar-link" aria-haspopup="true" aria-expanded="false">
							<span class="material-symbols-outlined" aria-hidden="true">support_agent</span>
							고객센터
							<span class="material-symbols-outlined sr-topbar-arrow" aria-hidden="true">expand_more</span>
						</button>

						<div class="sr-topbar-menu">
							<a href="javascript:alert('FAQ 페이지는 준비 중입니다.');">
								<span class="material-symbols-outlined" aria-hidden="true">help</span>
								<span>
									<b>자주 묻는 질문</b>
									<small>FAQ 로 빠르게 확인</small>
								</span>
							</a>

							<a href="javascript:alert('1:1 문의 페이지는 준비 중입니다.');">
								<span class="material-symbols-outlined" aria-hidden="true">forum</span>
								<span>
									<b>1:1 문의</b>
									<small>문의 등록 및 답변 확인</small>
								</span>
							</a>

							<a th:href="@{/member/notice/list}">
								<span class="material-symbols-outlined" aria-hidden="true">newspaper</span>
								<span>
									<b>공지사항</b>
									<small>서비스 소식과 이용 안내</small>
								</span>
							</a>
						</div>
					</div>

					<span class="sr-topbar-divider" aria-hidden="true"></span>

					<span class="sr-topbar-locale">
						<span class="material-symbols-outlined" aria-hidden="true">language</span>
						대한민국 <i>|</i> 한국어
					</span>

					<th:block sec:authorize="!isAuthenticated()">
						<span class="sr-topbar-divider" aria-hidden="true"></span>
						<a th:href="@{/member/registerUser}" class="sr-topbar-link">
							<span class="material-symbols-outlined" aria-hidden="true">person_add</span>
							회원가입
						</a>
					</th:block>

					<th:block sec:authorize="isAuthenticated()">
						<span class="sr-topbar-divider" aria-hidden="true"></span>
						<a th:href="@{/member/member_mypage}" class="sr-topbar-link">
							<span class="material-symbols-outlined" aria-hidden="true">card_membership</span>
							마일리지
						</a>
					</th:block>
				</div>

			</div>
		</div>

		<!-- ================= 메인 바 ================= -->
		<div class="sr-mainbar">
			<div class="sr-wrap sr-mainbar-inner">

				<!-- 로고 -->
				<a th:href="@{/main/home}" class="sr-brand" aria-label="SkyRoute 홈으로">

					<svg class="sr-brand-mark" viewBox="0 0 46 46" role="img" aria-hidden="true" focusable="false">
						<defs>
							<linearGradient id="srLogoGrad" x1="6" y1="40" x2="40" y2="8" gradientUnits="userSpaceOnUse">
								<stop offset="0" stop-color="#38BDF8"/>
								<stop offset="0.55" stop-color="#0A7AEA"/>
								<stop offset="1" stop-color="#0F172A"/>
							</linearGradient>
						</defs>

						<!-- 궤도 링 -->
						<circle cx="23" cy="23" r="20.2" fill="none" stroke="#0066E2" stroke-width="1.3" opacity="0.18"/>

						<!-- 지나온 항로 -->
						<path d="M8 33 C 13 20, 22 12, 31 11" fill="none"
							  stroke="url(#srLogoGrad)" stroke-width="2.6" stroke-linecap="round"/>

						<!-- 남은 항로 -->
						<path d="M31 11 C 34.5 10.4, 37.4 11.8, 39.4 14.6" fill="none"
							  stroke="#0066E2" stroke-width="2" stroke-linecap="round"
							  stroke-dasharray="1.4 3.4" opacity="0.55"/>

						<!-- 출발 지점 -->
						<circle cx="8" cy="33" r="3.2" fill="#fff" stroke="#0066E2" stroke-width="2.2"/>

						<!-- 항공기 -->
						<g transform="translate(30.6 11.4) rotate(54) scale(0.54)">
							<path d="M0 -13 C 1.7 -13 2.6 -10.6 2.7 -6.4 L12.6 0.4 L12.6 3.6 L2.7 0.9
									 L2.7 7.6 L6.1 10.6 L6.1 12.8 L0 11.1 L-6.1 12.8 L-6.1 10.6 L-2.7 7.6
									 L-2.7 0.9 L-12.6 3.6 L-12.6 0.4 L-2.7 -6.4 C -2.6 -10.6 -1.7 -13 0 -13 Z"
								  fill="#0F172A"/>
						</g>
					</svg>

					<span class="sr-brand-text">
						<strong>SkyRoute</strong>
						<small>FLY YOUR ROUTE</small>
					</span>
				</a>

				<!-- 주 메뉴 -->
				<nav class="sr-nav" aria-label="주 메뉴">
					<th:block sec:authorize="!isAuthenticated() || hasAuthority('USER')">

						<a th:href="@{/main/home}"
						   th:classappend="${activeMenu == 'book'} ? ' is-on'">항공권 예약</a>

						<a th:href="@{/member/member_booking}"
						   th:classappend="${activeMenu == 'lookup'} ? ' is-on'">예약 조회 · 변경</a>

						<a th:href="@{/member/member_schedule}"
						   th:classappend="${activeMenu == 'schedule'} ? ' is-on'">출도착 · 스케줄</a>

						<a th:href="@{/member/member_mypage}" sec:authorize="isAuthenticated()"
						   th:classappend="${activeMenu == 'my'} ? ' is-on'">마이페이지</a>

					</th:block>
				</nav>

				<!-- 우측 액션 -->
				<div class="sr-actions">

					<div class="sr-search">
						<input type="search" id="srGlobalSearch"
							   placeholder="궁금한 것을 검색해 보세요!"
							   aria-label="사이트 검색"
							   autocomplete="off">
						<button type="button" id="srGlobalSearchButton" aria-label="검색">
							<span class="material-symbols-outlined" aria-hidden="true">search</span>
						</button>
					</div>

					<th:block sec:authorize="!isAuthenticated()">
						<a th:href="@{/member/login}" class="sr-login-button">로그인</a>
					</th:block>

					<th:block sec:authorize="isAuthenticated()">
						<a th:href="@{/member/member_mypage}" class="sr-profile">
							<img th:src="@{/member/photoView}" alt="" class="sr-profile-photo">
							<b th:text="${#authentication.principal.memberVO != null
										 ? #authentication.principal.memberVO.name
										 : #authentication.name}">회원</b>
						</a>

						<button type="button" class="sr-login-button is-ghost" id="logout">로그아웃</button>

						<form th:action="@{/member/logout}" method="post" id="frm_logout" hidden></form>
					</th:block>

					<button type="button" class="sr-menu-toggle" id="srMenuToggle" aria-label="메뉴 열기" aria-expanded="false">
						<span class="material-symbols-outlined" aria-hidden="true">menu</span>
					</button>
				</div>

			</div>
		</div>

		<!-- 모바일 메뉴 -->
		<div class="sr-mobile-nav" id="srMobileNav" hidden>
			<div class="sr-wrap">
				<th:block sec:authorize="!isAuthenticated() || hasAuthority('USER')">
					<a th:href="@{/main/home}">항공권 예약</a>
					<a th:href="@{/member/member_booking}">예약 조회 · 변경</a>
					<a th:href="@{/member/member_schedule}">출도착 · 스케줄</a>
					<a th:href="@{/member/member_route}">운항 노선</a>
					<a th:href="@{/member/member_functions}">기능 한눈에 보기</a>
					<a th:href="@{/member/notice/list}">공지사항</a>
					<a th:href="@{/member/member_mypage}" sec:authorize="isAuthenticated()">마이페이지</a>
				</th:block>
			</div>
		</div>

	</header>

	<script th:inline="javascript">
		(() => {
			/* 로그아웃 */
			const logoutButton = document.getElementById("logout");
			const logoutForm = document.getElementById("frm_logout");

			if (logoutButton && logoutForm) {
				logoutButton.addEventListener("click", (event) => {
					event.preventDefault();
					logoutForm.submit();
				});
			}

			/* 통합 검색 (준비 중) */
			const searchInput = document.getElementById("srGlobalSearch");
			const searchButton = document.getElementById("srGlobalSearchButton");

			const runSearch = () => {
				window.alert("통합 검색은 준비 중입니다.");
			};

			if (searchButton) {
				searchButton.addEventListener("click", runSearch);
			}

			if (searchInput) {
				searchInput.addEventListener("keydown", (event) => {
					if (event.key === "Enter") {
						event.preventDefault();
						runSearch();
					}
				});
			}

			/* 모바일 메뉴 */
			const menuToggle = document.getElementById("srMenuToggle");
			const mobileNav = document.getElementById("srMobileNav");

			if (menuToggle && mobileNav) {
				menuToggle.addEventListener("click", () => {
					const willOpen = mobileNav.hidden;

					mobileNav.hidden = !willOpen;
					menuToggle.setAttribute("aria-expanded", String(willOpen));
				});
			}
		})();
	</script>

</th:block>
</html>
