<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<header th:fragment="headerFragment(activeMenu)" class="header">
  <div class="logo">
    <span class="material-symbols-outlined">admin_panel_settings</span>
    에어 어드민
  </div>
  
  <nav class="top-nav">
    <a th:href="@{/admin/base1}" class="nav-link" th:classappend="${activeMenu == 'base1'} ? 'active'">
      <span class="material-symbols-outlined">domain</span> 공항·게이트·노선
    </a>
    <a th:href="@{/admin/base2}" class="nav-link" th:classappend="${activeMenu == 'base2'} ? 'active'">

      <span class="material-symbols-outlined">manage_accounts</span> 계정·회원 관리
    </a>
    <a href="#" class="nav-link" th:classappend="${activeMenu == 'statistics'} ? 'active'">
      <span class="material-symbols-outlined">trending_up</span> 전사 운영 통계
    </a>
  </nav>

  <div class="user-menu">
    <div class="user-chip">
      <div class="avatar">M</div>
      <div class="meta">
        <div class="n">최고관리자 (Master)</div>
        <div class="r">SYSTEM ADMIN</div>

    </div>
    <button class="btn-logout">
      <span class="material-symbols-outlined">logout</span> 로그아웃
    </button>
  </div>

</html>
