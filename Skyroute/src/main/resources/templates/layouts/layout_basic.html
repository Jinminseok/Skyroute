<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<meta charset="UTF-8">
	<meta name="csrf-header" th:content="${_csrf.headerName}" />
	<meta name="csrf-token" th:content="${_csrf.token}">
	<title layout:title-pattern="$LAYOUT_TITLE > $CONTENT_TITLE">SpringPage</title>
	<link rel="stylesheet" th:href="@{/assets/css/member.css}" type="text/css">
	<link rel="stylesheet" th:href="@{/assets/css/header.css}" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
</head>
<body>
<div id="main">
	<!-- header 시작 -->
	<div id="main_header" th:insert="fragments/header::header"></div>
	<!-- header 끝 -->
	<!-- 중앙 컨텐츠 시작 -->
    <div id="main_body" layout:fragment="panel"></div>
    <!-- 중앙 컨텐츠 끝 -->
    <!-- footer 시작 -->
    <div id="main_footer" th:insert="fragments/footer::footer"></div>
    <!-- footer 끝 -->
</div>
</body>
</html>
