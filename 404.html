<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyRoute · 페이지 이동</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; background: #f8fafc; color: #334155; padding: 16px; }
  .box { max-width: 420px; text-align: center; }
  h1 { font-size: 20px; color: #0f172a; margin: 0 0 8px; }
  a { color: #0066e2; font-weight: 700; }
</style>
</head>
<body>
<div class="box" id="box"><p>이동 중…</p></div>
<script>
(function () {
  var BASE = '/skyroute';
  var m = location.pathname.slice(BASE.length).match(/^\/(guest|user|staff|admin)(\/.*)?$/);
  function fail() {
    document.getElementById('box').innerHTML = '<h1>이 화면은 데모에 포함되어 있지 않아요</h1>' +
      '<p>실제 서비스에서만 동작하는 기능이거나, 저장하지 않은 화면이에요.</p>' +
      '<p><a href="javascript:history.back()">이전 화면</a> · <a href="' + BASE + '/">소개 페이지</a></p>';
  }
  if (!m) return fail();
  var s = document.createElement('script');
  s.src = BASE + '/' + m[1] + '/_demo/data.js';
  s.onload = function () {
    var d = document.createElement('script');
    d.src = BASE + '/_demo/demo.js';
    d.onload = function () { if (window.__SR_GO(location.href, { replace: true }) === false) fail(); };
    d.onerror = fail;
    document.head.appendChild(d);
  };
  s.onerror = fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
