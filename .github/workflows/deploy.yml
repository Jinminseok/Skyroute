name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Skyroute

    steps:
      # Repository Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle Build
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build

      # SSH Key 생성
      - name: Create SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # SSH Agent
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # 서버 등록
      - name: Add known_hosts
        run: |
          ssh-keyscan -H 15.164.230.68 >> ~/.ssh/known_hosts

      # JAR 업로드
      - name: Upload Jar
        run: |
          scp build/libs/*.jar ubuntu@15.164.230.68:~/

      # 실행
      - name: Restart Spring Boot
        run: |
          ssh ubuntu@15.164.230.68 << 'EOF'
            pkill -f 'java -jar' || true
            nohup java -jar ~/Skyroute-0.0.1-SNAPSHOT.jar > log.txt 2>&1 &
          EOF
